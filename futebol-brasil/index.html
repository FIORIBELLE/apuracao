<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futebol Brasil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Barlow+Condensed:wght@500;600;700&family=Bungee&display=swap" rel="stylesheet">
<style>
/* Layout: painel de jogo moderno — fundo escuro, cartões arredondados, cabeçalho do clube com o próximo jogo em destaque, navegação por seções e barra inferior no celular */
:root{
  --bg:#0a101c; --bg2:#0f1729; --card:#131c30; --card2:#1a2540; --card3:#22304f; --line:#26344f; --line2:#33446a;
  --ink:#eef2fa; --muted:#93a0bb; --dim:#64718d;
  --acc:#22c55e; --acc-ink:#04220f; --acc2:#facc15; --blue:#3b82f6; --alerta:#f05252; --warnbg:#3a1820;
  --azul:#60a5fa; --verde:#22c55e; --amarelo:#facc15;
  --me:#14351f; --rv:#132a4a; --warn:#3a1820; --row:#111a2c;
  --r:12px; --r2:8px;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-logo:'Bungee',Impact,'Arial Black',sans-serif;
  --f-body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-data:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(1200px 500px at 50% -200px,#14335a55,transparent),radial-gradient(800px 400px at 100% 0,#0d3b2455,transparent);background-attachment:fixed;color:var(--ink);font:14px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.app{max-width:1180px;margin:0 auto}
a{color:inherit}
.win{background:transparent}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px 12px;color:var(--muted);font-weight:600;font-size:13px}
.logo{font-family:var(--f-logo);letter-spacing:.03em;color:var(--acc2);font-weight:400;font-size:17px}
.logo i{font-style:normal;color:var(--acc)}
.btn{font:600 13px/1.1 var(--f-body);color:var(--ink);background:var(--card2);border:1px solid var(--line2);padding:7px 12px;cursor:pointer;min-height:34px;border-radius:999px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--card3)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:focus-visible,.tb:focus-visible,.mrow:focus-visible,.nav button:focus-visible,.slot:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.btn.go{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font:700 16px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:10px 20px;min-height:42px}
.btn.go:hover{background:#2fd86a}
.btn.go:disabled{background:var(--card3);color:var(--muted);border-color:var(--line2)}
.btn.warn{color:#ff8a8a;border-color:#6b2a35}
.btn.sm{min-height:28px;padding:4px 10px;font-size:12px}
.sunk{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative;margin-top:12px}
.grp>.lg{display:block;font:700 13px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
details.grp>summary{cursor:pointer;color:var(--muted)}
.badge{display:inline-block;min-width:18px;padding:1px 6px;margin-left:6px;background:var(--alerta);color:#fff;font-size:11px;text-align:center;border-radius:999px;font-weight:700}
.content{padding:16px 0 8px;min-height:420px}
/* cabeçalho do clube */
.hud{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr) minmax(0,1.4fr);gap:12px}
.hud>.card{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.club{background:linear-gradient(135deg,var(--cc,#1a2540) 0%,var(--card) 70%)}
.crest{display:flex;align-items:center;gap:12px}
.crest .shield{width:48px;height:56px;flex:none;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);display:flex;align-items:center;justify-content:center;font:700 15px var(--f-display);letter-spacing:.02em}
.crest h1{margin:0;font:700 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:baseline;gap:5px;background:#0006;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.chip b{color:var(--ink);font:700 15px var(--f-data)}
.big{font:700 28px/1 var(--f-data);font-variant-numeric:tabular-nums}
.kv{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.kv b{font-family:var(--f-data);font-size:17px;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.meter{height:8px;width:100%;background:var(--card3);border-radius:999px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--acc);border-radius:999px}
.meter.low i{background:var(--alerta)}.meter.mid i{background:var(--acc2)}
.next{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.nextm{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.nextm .tb{width:100%;text-align:center;font-size:16px;padding:6px 8px}
.nextm .vsx{font:700 18px var(--f-data);color:var(--muted)}
.vs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--f-data);font-weight:700}
/* navegação */
.nav{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.nav button{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);color:var(--muted);font:700 15px var(--f-display);letter-spacing:.05em;text-transform:uppercase;padding:9px 16px;border-radius:999px;cursor:pointer;min-height:40px}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{color:var(--ink)}
.nav button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.subnav{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 14px var(--f-body);padding:8px 12px;cursor:pointer;white-space:nowrap}
.subnav button.on{color:var(--ink);border-bottom-color:var(--acc)}
.menu{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0 0}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.stat>div{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sbar{display:flex;gap:6px;padding:8px 0;flex-wrap:wrap;color:var(--dim)}
.sbar>span{padding:2px 10px;font-size:12px;border:1px solid var(--line);border-radius:999px}
.botnav{display:none}
/* tabelas */
.scroll{overflow-x:auto;max-width:100%}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-family:var(--f-data);font-size:15.5px;font-variant-numeric:tabular-nums}
.grid th{text-align:left;font:700 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 8px;white-space:nowrap;border-bottom:1px solid var(--line);background:var(--card)}
.grid th[title]{cursor:help;text-decoration:underline dotted var(--dim);text-underline-offset:3px}
.grid td{padding:7px 8px;border-bottom:1px solid #1d2840;white-space:nowrap}
.grid tbody tr:last-child td{border-bottom:0}
.grid tr.me td{background:var(--me)}
.grid tr.rv td{background:var(--rv)}
.grid tr.warn td{background:var(--warn)}
.grid td.n,.grid th.n{text-align:right}
.grid td.c,.grid th.c{text-align:center}
.grid tr.click{cursor:pointer}
.grid tbody tr:hover td{background:#1a2742}
.grid a{text-decoration:none}.grid a:hover{text-decoration:underline}
.tb{display:inline-block;min-width:12ch;padding:2px 8px;font-family:var(--f-data);font-weight:700;font-size:14px;letter-spacing:.03em;text-transform:uppercase;line-height:1.4;white-space:nowrap;text-align:left;border-radius:6px;border:0}
.tb.me{outline:2px solid var(--acc2);outline-offset:2px}
.tb.sm{min-width:0;font-size:12.5px;padding:0 6px}
.zone-l{box-shadow:inset 3px 0 0 var(--acc)}
.zone-up{box-shadow:inset 3px 0 0 var(--blue)}
.zone-dn{box-shadow:inset 3px 0 0 var(--alerta)}
.dots i{display:inline-block;width:10px;height:10px;margin-right:3px;border-radius:50%}
.dots .V{background:var(--acc)}.dots .E{background:#7b869e}.dots .D{background:var(--alerta)}
.pos{display:inline-block;min-width:26px;text-align:center;font-weight:700;color:#fff;border-radius:5px;padding:0 4px}
.pos.G{background:#a16207}.pos.D{background:#1d4ed8}.pos.M{background:#15803d}.pos.A{background:#b91c1c}
.st{display:inline-block;width:28px;height:26px;font-weight:700;text-align:center;cursor:pointer;border:1px solid var(--line2);background:var(--card2);color:var(--muted);font-family:var(--f-data);border-radius:6px}
.st.T{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}.st.R{background:var(--acc2);color:#2a2000;border-color:var(--acc2)}
.tag{display:inline-block;font:700 11px/1.5 var(--f-body);padding:0 6px;border-radius:999px;margin-right:3px;background:var(--card3);color:var(--ink)}
.tag.inj{background:#5a1d26;color:#ffb4b4}.tag.sus{background:#4a3410;color:#ffd58a}.tag.sale{background:#173a66;color:#a8d0ff}.tag.up{background:#14422a;color:#8ff0b4}.tag.gem{background:#3b2a6b;color:#d6c4ff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.cols>*{min-width:0}
h2{font:700 22px/1.2 var(--f-display);margin:0 0 10px;letter-spacing:.03em;text-transform:uppercase;text-wrap:balance;color:var(--ink)}
h3{font:700 15px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
input,select{font:14px var(--f-body);padding:6px 10px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);border-radius:var(--r2);min-height:34px;max-width:100%}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
textarea{font:12px/1.3 ui-monospace,Consolas,monospace;width:100%;min-height:90px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);border-radius:var(--r2);padding:8px}
label{color:var(--muted);font-size:13px}
.news{display:flex;flex-direction:column;gap:0}
.news>div{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.news>div:last-child{border-bottom:0}
.news .when{font-family:var(--f-data);color:var(--muted);min-width:64px}
.news .txt{flex:1;min-width:0}
.news .k-ofr{background:#10223d}.news .k-job{background:#13301f}.news .k-bad{background:#34161d}
.help{background:#0f2a1b;border:1px solid #1d5234;border-radius:var(--r);padding:12px 14px;color:#cdeedb;font-size:13px}
.help b{color:#fff}
.help.blue{background:#0f1f3a;border-color:#22406e;color:#cfe0ff}
/* início */
.hero{padding:34px 16px 28px;text-align:center;border-radius:var(--r);background:linear-gradient(135deg,#0b3d24,#0c2547 70%);border:1px solid var(--line);margin-bottom:12px}
.hero h1{font:400 clamp(30px,8vw,60px)/1 var(--f-logo);margin:0;color:var(--acc2);letter-spacing:.02em}
.hero p{margin:10px 0 0;font:600 17px var(--f-data);letter-spacing:.06em;text-transform:uppercase;color:#cfe0ff}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.picker .tb{width:100%;cursor:pointer;padding:8px 10px}
.picker .tb.sel{outline:3px solid var(--acc);outline-offset:2px}
.wcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wcg>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.wcg .tb{width:100%;cursor:pointer;padding:5px 8px}
.wcg .tb.sel{outline:3px solid var(--acc);outline-offset:2px}
/* ao vivo */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px;background:linear-gradient(180deg,#0e1a2f,#0a1322);color:#f5f5f5;border:1px solid var(--line);border-radius:var(--r)}
.board .side{display:flex;flex-direction:column;gap:6px;min-width:0;align-items:flex-start}
.board .side.r{align-items:flex-end;text-align:right}
.board .sc{font:700 60px/1 var(--f-data);color:var(--acc2);font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.04em}
.board .mn{font:600 15px var(--f-data);text-align:center;color:var(--acc)}
.board .tb{font-size:19px}
.feed{max-height:200px;overflow:auto;font-family:var(--f-data);font-size:15px;padding:8px 12px}
.feed div{padding:2px 0}
.ev{display:inline-block;min-width:36px;text-align:center;font-size:11px;font-weight:700;padding:1px 4px;margin-right:6px;border-radius:4px;background:var(--card3)}
.ev.goal{background:var(--acc);color:var(--acc-ink)}.ev.yc{background:var(--acc2);color:#2a2000}.ev.rc{background:var(--alerta);color:#fff}.ev.inj{background:#5a1d26;color:#ffb4b4}.ev.sub{background:#22304f}.ev.et{background:var(--blue);color:#fff}.ev.pen{background:var(--blue);color:#fff}
.mlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:6px 12px}
.mrow{display:grid;grid-template-columns:auto 52px auto minmax(0,1fr);gap:8px;align-items:center;padding:6px 10px;border-radius:var(--r2);cursor:pointer;background:var(--card);border:1px solid var(--line)}
.mrow .sc{font:700 19px var(--f-data);text-align:center;font-variant-numeric:tabular-nums}
.mrow .last{font-family:var(--f-data);font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.mine{background:var(--me);border-color:#2a6b40}
.mrow.rvm{background:var(--rv)}
.pubc{color:var(--azul);font-weight:600}
.mrow.flash{animation:fl 1.2s steps(2) 2}
@keyframes fl{0%{background:#5c4b00}100%{background:var(--card)}}
@media (prefers-reduced-motion:reduce){.mrow.flash{animation:none;background:#5c4b00}}
.banner{padding:10px 14px;background:#3d3200;color:#ffe9a3;font-weight:600;border-radius:var(--r);border:1px solid #6b5800}
/* campo */
.lineup{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:start}
.field{position:relative;background:repeating-linear-gradient(180deg,#14713a 0 48px,#178042 48px 96px);border:2px solid #ffffffa0;border-radius:var(--r);padding:14px 10px;display:flex;flex-direction:column;gap:12px}
.field:before{content:'';position:absolute;left:30%;right:30%;bottom:-2px;height:54px;border:2px solid #ffffff70;border-bottom:0}
.field:after{content:'';position:absolute;left:50%;top:-2px;width:90px;height:45px;transform:translateX(-50%);border:2px solid #ffffff50;border-top:0;border-radius:0 0 90px 90px}
.frow{display:flex;justify-content:space-around;gap:6px;position:relative;z-index:1}
.slot{flex:1 1 0;min-width:0;max-width:130px;background:#0b1424e6;color:#fff;border:2px solid var(--acc);padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--f-data);cursor:pointer;border-radius:10px}
.slot b{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .spos{font-size:11px;font-weight:700;color:#9fb0cf;letter-spacing:.06em}.slot .sfor{font-size:14px;font-weight:700;color:var(--acc2)}.slot .sfor s{color:#8090ad;font-weight:500}
.slot.sec{border-color:#a3e635}.slot.nb{border-color:var(--acc2)}.slot.bad{border-color:var(--alerta);background:#3a1820e6}.slot.empty{border-style:dashed;border-color:#ffffffa0;background:#00000040}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid;vertical-align:-2px;margin-right:4px}
.strbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.strbar .meter{margin:0}
.fbar{display:inline-flex;align-items:center;gap:6px}
.fbar span{display:inline-block;width:46px;height:6px;background:var(--card3);border-radius:999px;overflow:hidden}
.fbar span i{display:block;height:100%;background:var(--acc)}
.views{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.views button{background:none;border:0;color:var(--muted);font:600 13px var(--f-body);padding:5px 12px;border-radius:999px;cursor:pointer}
.views button.on{background:var(--card3);color:var(--ink)}
/* ficha do jogador */
.pcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:4px 0 10px}
.pcard .ovr{width:76px;height:86px;border-radius:12px;background:linear-gradient(160deg,#3a3010,#1c1a10);border:2px solid var(--acc2);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--acc2)}
.pcard .ovr b{font:700 38px/1 var(--f-data)}
.pcard .ovr span{font:700 12px var(--f-data);letter-spacing:.08em}
.pcard h2{margin:0 0 4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:10px}
.tile .v{font:700 22px/1.1 var(--f-data);margin-top:2px}
.tile .h{font-size:12px;color:var(--muted);margin-top:2px}
.potbar{position:relative;height:12px;background:var(--card3);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.potbar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:999px}
.potbar u{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#facc1580 0 6px,#facc1530 6px 12px)}
.spark{display:flex;align-items:flex-end;gap:6px;height:60px;margin-top:6px}
.spark div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font:600 11px var(--f-data);color:var(--muted)}
.spark i{display:block;width:100%;max-width:34px;background:var(--blue);border-radius:4px 4px 0 0}
.spark div:last-child i{background:var(--acc)}
/* modal */
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
.ov .win{width:min(680px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line2);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px #000a}
.ov .tbar{padding:12px 16px;border-bottom:1px solid var(--line);color:var(--ink);font:700 16px var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.ov .body{padding:16px;overflow:auto}
.ov .foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{background:var(--card3);color:var(--ink);border:0;width:30px;height:30px;font:700 14px var(--f-body);cursor:pointer;padding:0;line-height:1;border-radius:50%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;z-index:60;font-weight:600;max-width:calc(100% - 32px);border-radius:999px;box-shadow:0 8px 24px #0008}
.trophy{font-family:var(--f-data);font-weight:700}
@media (max-width:900px){.hud{grid-template-columns:1fr 1fr}.hud .card.nx{grid-column:1/-1;order:-1}.lineup{grid-template-columns:1fr}}
@media (max-width:640px){
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .hud{grid-template-columns:1fr}.hud .card.money{display:none}
  .nav{display:none}

// lesões frequentes e excesso de cartões derrubam o preço; gols acima do esperado para a posição sobem
function riskF(p){const j=Math.max(12,p.tj||0);const inj=((p.ti||0)+(p.tmi||0)/3)/j;const fi=clamp(1-inj*1.5,.55,1);
  const c=((p.ty||0)+3*(p.tr||0))/j;const fc=clamp(1-Math.max(0,c-.2)*.6,.85,1);let fp=1;
  if((p.tj||0)>=10&&(p.p==='A'||p.p==='M')){const ex=p.p==='A'?.35:.12;fp=clamp(1+((p.tgj||0)/p.tj-ex)*.8,.85,1.25);}return {fi,fc,fp,t:fi*fc*fp};}

function genName(used){for(let k=0;k<50;k++){const n=R()<.3?pick(NICK):pick(FIRST)+' '+pick(LAST);if(!used.has(n)){used.add(n);return n;}}return pick(FIRST)+' '+pick(LAST)+' '+ri(2,9);}

    if(/^\d+$/.test(tk[end-1])&&/^\d+$/.test(tk[end-2])){a=+tk[end-1];f=+tk[end-2];end-=2;}else{f=+tk[end-1];a=pos==='G'?ri(22,34):ri(20,32);end-=1;}

function roundRobin(ids){const n=ids.length;let arr=shuffle(ids.slice());const rounds=[];
  for(let r=0;r<n-1;r++){const m=[];const alt=isV5();for(let i=0;i<n/2;i++){let h=arr[i],a=arr[n-1-i];if(alt?(i===0?r%2:r%2===1):(r+i)%2)[h,a]=[a,h];m.push({h,a,hg:null,ag:null});}rounds.push(m);arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];}
  return rounds.concat(rounds.map(m=>m.map(x=>({h:x.a,a:x.h,hg:null,ag:null}))));}

/* ====================== POSIÇÕES E POTENCIAL (mundo versão 6) ====================== */
const V6=()=>!!S&&S.v>=6;
const SECT={GOL:'G',ZAG:'D',LD:'D',LE:'D',VOL:'M',MC:'M',MD:'M',ME:'M',PD:'A',PE:'A',CA:'A'};
const POSL={GOL:'Goleiro',ZAG:'Zagueiro',LD:'Lateral direito',LE:'Lateral esquerdo',VOL:'Volante',MC:'Meia central',MD:'Meia direita',ME:'Meia esquerda',PD:'Ponta direita',PE:'Ponta esquerda',CA:'Centroavante'};
const DPS=Object.keys(POSL);
const NEIGH={GOL:[],ZAG:['LD','LE','VOL'],LD:['LE','ZAG','MD'],LE:['LD','ZAG','ME'],VOL:['ZAG','MC','MD','ME'],MC:['VOL','MD','ME','CA'],MD:['ME','MC','PD','LD'],ME:['MD','MC','PE','LE'],PD:['PE','MD','CA'],PE:['PD','ME','CA'],CA:['PD','PE','MC']};
const FSLOTS={'4-4-2':['GOL','LD','ZAG','ZAG','LE','VOL','VOL','MD','ME','CA','CA'],'4-3-3':['GOL','LD','ZAG','ZAG','LE','VOL','MC','MC','PD','PE','CA'],'4-2-3-1':['GOL','LD','ZAG','ZAG','LE','VOL','VOL','MD','MC','ME','CA'],'3-5-2':['GOL','ZAG','ZAG','ZAG','VOL','VOL','MD','ME','MC','CA','CA'],'4-5-1':['GOL','LD','ZAG','ZAG','LE','VOL','VOL','MD','ME','MC','CA'],'5-3-2':['GOL','LD','ZAG','ZAG','ZAG','LE','VOL','MC','MC','CA','CA'],'3-4-3':['GOL','ZAG','ZAG','ZAG','VOL','VOL','MD','ME','PD','PE','CA'],'5-4-1':['GOL','LD','ZAG','ZAG','ZAG','LE','VOL','VOL','MD','ME','CA'],'4-2-4':['GOL','LD','ZAG','ZAG','LE','VOL','MC','PD','PE','CA','CA']};
// aproveitamento da força conforme a vaga: origem 100%, secundária 92%, vizinha 80%, fora de função 60%, goleiro trocado 25%
function fit(p,pos){if(!p||!p.dp||!pos)return 1;if(pos===p.dp)return 1;if((p.sp||[]).includes(pos))return .92;if(pos==='GOL'||p.dp==='GOL')return .25;if((NEIGH[p.dp]||[]).includes(pos))return .8;return .6;}
const effF=(p,pos)=>Math.round(p.f*fit(p,pos));
const slotsOf=t=>FSLOTS[t.form]||FSLOTS['4-4-2'];
const NEEDP={GOL:3,ZAG:3,LD:2,LE:2,VOL:2,MC:2,MD:1,ME:1,PD:1,PE:1,CA:2};
const SECPOS={G:['GOL'],D:['ZAG','LD','LE'],M:['VOL','MC','MD','ME'],A:['CA','PD','PE']};
const SECW={G:[1],D:[.5,.25,.25],M:[.3,.3,.2,.2],A:[.45,.275,.275]};
function rollSec(p){const nb=NEIGH[p.dp]||[];p.sp=[];if(nb.length&&R()<.45){p.sp.push(pick(nb));if(R()<.25){const o=nb.filter(x=>!p.sp.includes(x));if(o.length)p.sp.push(pick(o));}}}
// jogador gerado recebe a posição que mais falta no elenco do setor dele
function givePos(p,t){const opts=SECPOS[p.p];let dp=null;
  if(t){const have={};t.pids.forEach(id=>{const q=PL(id);if(q&&q.dp)have[q.dp]=(have[q.dp]||0)+1;});let best=0;for(const o of opts){const d=(NEEDP[o]||0)-(have[o]||0);if(d>best){best=d;dp=o;}}}
  if(!dp){let r=R();const w=SECW[p.p];dp=opts[opts.length-1];for(let i=0;i<opts.length;i++){r-=w[i];if(r<=0){dp=opts[i];break;}}}
  p.dp=dp;rollSec(p);}
function givePot(p){p.pot=clamp(p.a<=20?p.f+ri(6,20):p.a<=23?p.f+ri(2,12):p.a<=26?p.f+ri(0,5):p.f,25,97);}
function potTxt(p){if(p.pot==null)return '—';if(p.a>27||p.pot<=p.f+1)return 'no auge';return p.pot>=86?'craque':p.pot>=78?'alto':p.pot>=68?'médio':'baixo';}
function posTag2(p){if(!(V6()&&p.dp))return posTag(p.p);return `<span class="pos ${p.p}" style="width:auto;min-width:30px;padding:0 3px" title="${POSL[p.dp]}">${p.dp}</span>${(p.sp||[]).length?`<span class="small muted"> ${p.sp.join('·')}</span>`:''}`;}
// distribui os titulares pelas vagas: melhor força efetiva primeiro (empates pelo número do jogador)
function fillSlots(slots,players,pre){const sl=pre?pre.slice():Array(slots.length).fill(null);const used=new Set(sl.filter(x=>x!=null));const pairs=[];
  slots.forEach((pos,i)=>{if(sl[i]!=null)return;players.forEach(p=>{if(!used.has(p.id))pairs.push([p.f*fit(p,pos),i,p.id]);});});
  pairs.sort((a,b)=>b[0]-a[0]||a[2]-b[2]||a[1]-b[1]);for(const [v,i,id] of pairs){if(sl[i]!=null||used.has(id))continue;sl[i]=id;used.add(id);}return sl;}
function autoLineup6(t){const slots=slotsOf(t);const pool=t.pids.map(PL).filter(avail);const sl=fillSlots(slots,pool);t.sl=sl;t.xi=sl.filter(x=>x!=null);
  const rest=pool.filter(p=>!t.xi.includes(p.id)).sort((a,b)=>b.f-a.f||a.id-b.id);const bench=[];const g=rest.find(p=>p.dp==='GOL');if(g)bench.push(g.id);
  for(const p of rest){if(bench.length>=7)break;if(!bench.includes(p.id))bench.push(p.id);}t.bench=bench;}
function normSlots(t){if(!V6())return;const slots=slotsOf(t);
  if(!t.sl||t.sl.length!==slots.length){const xi=t.xi.map(PL).filter(Boolean);t.sl=fillSlots(slots,xi);}
  else t.sl=t.sl.map(id=>id!=null&&t.pids.includes(id)?id:null);
  t.xi=t.sl.filter(x=>x!=null);t.bench=t.bench.filter(id=>t.pids.includes(id)&&!t.xi.includes(id));}
function checkLineup6(t){normSlots(t);const slots=slotsOf(t);const ok=id=>avail(PL(id));let changed=false;
  t.sl=t.sl.map(id=>{if(id!=null&&!ok(id)){changed=true;return null;}return id;});t.bench=t.bench.filter(id=>ok(id));
  const free=t.pids.map(PL).filter(p=>avail(p)&&!t.sl.includes(p.id));if(t.sl.some(x=>x==null)){const before=t.sl.filter(x=>x!=null).length;t.sl=fillSlots(slots,free,t.sl);if(t.sl.filter(x=>x!=null).length!==before)changed=true;}
  t.xi=t.sl.filter(x=>x!=null);t.bench=t.bench.filter(id=>!t.xi.includes(id));return changed;}
function slotMap(t){const m={};const slots=slotsOf(t);(t.sl||[]).forEach((id,i)=>{if(id!=null)m[id]=slots[i];});return m;}

/* evolução no treino (mundo versão 7): 3 avaliações durante a temporada e uma no fim */
const V7=()=>!!S&&S.v>=7;
const EVO_AT=[9,19,28];
const evoBase=a=>a<=20?1.1:a<=23?.8:a<=25?.5:a<=27?.3:0;
const playF=r=>r>=.6?1.4:r>=.25?1:.5;
function trainCheck(){S.teams.forEach(t=>{const ps=t.pids.map(PL).filter(Boolean);if(!ps.length)return;const mx=Math.max(1,...ps.map(p=>p.gm-(p.ck||0)));const up=[];
  ps.forEach(p=>{const r=(p.gm-(p.ck||0))/mx;p.ck=p.gm;p.rt=Math.round(r*100)/100;if(p.a>27||p.pot==null||p.pot<=p.f)return;
    const g=Math.min(p.pot-p.f,96-p.f,Math.floor(evoBase(p.a)*playF(r)+R()));if(g>0){p.f+=g;up.push(`${p.n} +${g} (${p.f})`);}});
  if(isHuman(t.id)&&up.length)news(`Evolução no treino: ${up.slice(0,10).join(', ')}${up.length>10?` e mais ${up.length-10}`:''}.`,'job',mgrIdx(t.id));});}

/* ====================== ESCALAÇÃO ====================== */
const avail=p=>p&&p.inj===0&&p.sus===0;
function autoLineup(t){if(V6())return autoLineup6(t);
  const [d,m,a]=FORMS[t.form]||FORMS['4-4-2'];
  const pool=t.pids.map(PL).filter(avail).sort((x,y)=>y.f-x.f);const xi=[];const take=(pos,n)=>{for(const p of pool){if(n<=0)break;if(p.p===pos&&!xi.includes(p.id)){xi.push(p.id);n--;}}return n;};
  take('G',1);let left=take('D',d)+take('M',m)+take('A',a);
  for(const p of pool){if(left<=0)break;if(!xi.includes(p.id)&&p.p!=='G'){xi.push(p.id);left--;}}
  if(!xi.some(id=>PL(id).p==='G')){const g=pool.find(p=>!xi.includes(p.id));if(g&&xi.length<11)xi.push(g.id);}
  const rest=pool.filter(p=>!xi.includes(p.id));const bench=[];const bg=rest.find(p=>p.p==='G');if(bg)bench.push(bg.id);
  for(const p of rest){if(bench.length>=7)break;if(!bench.includes(p.id))bench.push(p.id);}
  t.xi=xi;t.bench=bench;
}
function checkLineup(t){if(V6())return checkLineup6(t);
  const ok=id=>t.pids.includes(id)&&avail(PL(id));const before=t.xi.length;
  t.xi=t.xi.filter(ok);t.bench=t.bench.filter(id=>ok(id)&&!t.xi.includes(id));
  let changed=t.xi.length!==before;

function strength(sd){let g=0,D=0,M=0,A=0,hasG=false;

  else for(const id of sd.on){const p=PL(id);if(!p)continue;if(p.p==='G'){if(!hasG){g=p.f;hasG=true;}else D+=p.f*.5;}else if(p.p==='D')D+=p.f;else if(p.p==='M')M+=p.f;else A+=p.f;}

function prepSide(tid){const t=TM(tid);const k=mgrIdx(tid);const human=k>=0&&!S.mgr[k].fired;if(!human)autoLineup(t);

  return {tid,slot:V6()?slotMap(t):null,on:t.xi.slice(0,11),bench:t.bench.slice(),subs:0,post:human?t.post:1,human,auto:human?S.mgr[k].autoSub||S.online:true,user:tid===myTid(),served,app:new Set(t.xi),yel:new Set(),out:new Set()};}
function mkMatch(fx,comp){const m={fx,comp,s:[prepSide(fx.h),prepSide(fx.a)],g:[0,0],ev:[],flash:0,done:false,ko:comp===3||!!fx.ko,et:!!fx.et,neu:!!fx.n};m.mine=m.s[0].user||m.s[1].user;return m;}
function addEv(m,min,type,side,txt){m.ev.push({m:min,type,side,txt});}
function pickWeighted(list,w){let tot=0;const ws=list.map(x=>{const v=w(x);tot+=v;return v;});let r=R()*tot;for(let i=0;i<list.length;i++){r-=ws[i];if(r<=0)return list[i];}return list[list.length-1];}
function bestBench(sd,pos,slotPos){if(sd.slot&&slotPos){const b=sd.bench.map(PL).filter(p=>p&&avail(p));return b.sort((x,y)=>y.f*fit(y,slotPos)-x.f*fit(x,slotPos)||x.id-y.id)[0];}const b=sd.bench.map(PL).filter(p=>p&&avail(p));let c=b.filter(p=>p.p===pos);if(!c.length)c=b.filter(p=>p.p!=='G');if(!c.length)c=b;return c.sort((x,y)=>y.f-x.f)[0];}

  for(let i=0;i<2;i++){const sd=m.s[i];if(sd.human)continue;const diff=m.g[i]-m.g[1-i];

    S.mgr.forEach(mg=>{if(c.champ===mg.tid){mg.fin.pre+=3e7;awardTitle(mg,`Copa do Brasil ${S.year}`,3e7);mg.rep=clamp(mg.rep+10,1,100);mg.conf=clamp(mg.conf+20,0,100);}if(c.vice===mg.tid)mg.fin.pre+=1.5e7;});
    news(`${TM(c.champ).name} é campeão da Copa do Brasil ${S.year}!`,isHuman(c.champ)?'job':'');return;}
  shuffle(winners);const nr=[];for(let i=0;i<winners.length;i+=2)nr.push({h:winners[i],a:winners[i+1],hg:null,ag:null});c.rounds.push(nr);
}

/* ====================== TRANSFERÊNCIAS ====================== */
function movePlayer(pid,to,fee){const p=PL(pid);const from=TM(p.t),dest=TM(to);
  from.pids=from.pids.filter(x=>x!==pid);from.xi=from.xi.filter(x=>x!==pid);from.bench=from.bench.filter(x=>x!==pid);
  dest.pids.push(pid);p.t=to;p.sale=false;from.cash+=fee;dest.cash-=fee;
  const kf=mgrIdx(from.id),kt=mgrIdx(dest.id);
  if(kf>=0)S.mgr[kf].fin.ven+=fee;if(kt>=0){S.mgr[kt].fin.com-=fee;p.sal=Math.round(Math.max(p.sal,salFor(p))*1.1/1000)*1000;}
  S.mgr.forEach(mg=>mg.offers=mg.offers.filter(o=>o.pid!==pid));
  if(kf<0&&from.pids.length<18){const used=new Set(from.pids.map(i=>PL(i).n));youth(from,used);}
}
// quanto o clube vendedor quer e se o jogador aceita ir para o seu clube
function askInfo(p,u){const t=TM(p.t);const v=value(p);const rank=t.pids.map(PL).sort((a,b)=>b.f-a.f).indexOf(p);const top=rank<3;
  const need=v*(top?1.35:1.05)*(t.div<u.div&&t.div<=2?1.1:1)*(t.div===4?1.5:1);return {need,ask:Math.ceil(need/1e4)*1e4,top,refuse:t.rep-u.rep>22&&(p.id*7+S.year)%10<6};}
function evalBid(mg,p,amt){const t=TM(p.t),u=TM(mg.tid);const A=askInfo(p,u);
  if(u.pids.length>=32)return {ok:false,msg:'Seu elenco já tem 32 jogadores. Venda ou dispense alguém antes.'};
  if(u.cash<amt)return {ok:false,msg:`Caixa insuficiente. Você tem ${money(u.cash)}.`};
  if(A.refuse)return {ok:false,msg:`${p.n} não quer jogar no ${u.name} agora.`};
  const need=A.need;
  if(amt>=need)return {ok:true};
  if(amt>=need*.72)return {ok:false,counter:Math.ceil(need/1e4)*1e4,msg:`O ${t.name} recusou, mas aceita negociar.`};
  return {ok:false,msg:`O ${t.name} considerou a proposta muito baixa.`};}
function genOffers(mg,k){if(mg.tid==null||mg.fired)return;const u=TM(mg.tid);
  u.pids.map(PL).forEach(p=>{const v=value(p);const unsolicited=!p.sale&&p.f>=baseF(u)+8&&R()<.02;
    if((p.sale&&R()<.4)||unsolicited){if(mg.offers.some(o=>o.pid===p.id))return;
      const buyers=S.teams.filter(t=>!isHuman(t.id)&&t.cash>v*.8&&(S.v>=4?(t.div===u.div||t.rep>=u.rep-3):(t.div<=2?Math.abs(t.div-u.div)<=1:t.rep>=u.rep&&p.f>=baseF(u)))&&(unsolicited?t.rep>=u.rep-5:true));if(!buyers.length)return;
      const b=pick(buyers);const amt=Math.round(v*(unsolicited?1+R()*.4:.75+R()*.45)/1e4)*1e4;
      mg.offers.push({id:S.nid++,pid:p.id,from:b.id,amt,exp:S.md+3});news(`Proposta: o ${b.name} oferece ${money(amt)} por ${p.n}.`,'ofr',k);}});}
function aiTransfers(){const v4=S.v>=4;for(let k=0;k<(v4?6:3);k++){const buyers=S.teams.filter(t=>!isHuman(t.id)&&(v4?isLeague(t):isDom(t))&&t.pids.length<30).sort((a,b)=>b.rep-a.rep||a.id-b.id).slice(0,v4?70:32);const b=pick(buyers);if(!b)return;
  const pos=pick(['G','D','D','M','M','A','A']);const mine=b.pids.map(PL).filter(p=>p.p===pos).sort((x,y)=>y.f-x.f);const ref=mine[Math.min(1,mine.length-1)];const lvl=ref?ref.f:50;
  const cands=Object.values(S.P).filter(p=>p.p===pos&&p.t!==b.id&&!isHuman(p.t)&&(v4||isDom(TM(p.t)))&&TM(p.t).rep<b.rep&&TM(p.t).pids.length>19&&p.f>lvl&&value(p)<=b.cash*.6&&p.a<32);
  if(!cands.length)continue;const p=cands.sort((x,y)=>y.f-x.f||x.id-y.id)[ri(0,Math.min(3,cands.length-1))];const from=TM(p.t);const fee=Math.round(value(p)*(1+R()*.2)/1e4)*1e4;
  movePlayer(p.id,b.id,fee);news(`Mercado: ${p.n} deixa o ${from.name} e acerta com o ${b.name} por ${money(fee)}.`,'');}}
function genJobs(mg,k){const t=mg.tid!=null?TM(mg.tid):null;if(!t||S.md<8||mg.fired||mg.jobs.length)return;
  const p=.03+Math.max(0,mg.rep-45)/500;if(R()>p)return;
  const c=S.teams.filter(x=>!isHuman(x.id)&&(S.v>=4?isLeague(x):isDom(x))&&x.rep>t.rep+3&&x.rep<=mg.rep+22);if(!c.length)return;const j=pick(c);
  mg.jobs.push({tid:j.id,exp:S.md+3});news(`Convite: a diretoria do ${j.name} quer você como técnico. Responda na Caixa de entrada.`,'job',k);}
function takeJob(mg,k,tid){const old=mg.tid!=null?TM(mg.tid):null;if(old){old.pids.forEach(id=>PL(id).sale=false);old.post=1;}
  mg.tid=tid;mg.conf=60;mg.jobs=[];mg.offers=[];mg.fired=false;mg.firedOffers=null;mg.fin=emptyFin();mg.finLast=null;if(isV5()){mg.finPrev=emptyFin();mg.cash0=TM(tid).cash;mg.ledger=[];}const t=TM(tid);if(!FORMS[t.form])t.form='4-4-2';autoLineup(t);
  news(`${mg.name} é o novo técnico do ${t.name}. Meta: ${expectTxt(t)}.`,'job');}
function firedOffers(mg){const cur=mg.tid!=null?TM(mg.tid):null;let c=S.teams.filter(x=>!isHuman(x.id)&&(S.v>=4?isLeague(x):isDom(x))&&x.rep<=Math.max(45,mg.rep+5)&&(!cur||x.rep<cur.rep));
  if((!S.online||S.v>=5))c=shuffle(c).slice(0,3);else{c=shuffle(c).sort((a,b)=>b.div-a.div).slice(0,8);c=shuffle(c).slice(0,3);}
  if(c.length<2)c=shuffle(S.teams.filter(x=>x.div===2&&!isHuman(x.id))).slice(0,3);return c.map(x=>x.id);}

/* ====================== AÇÕES DOS TÉCNICOS ======================
   Toda decisão que muda o mundo passa por applyAct. No modo online cada
   jogador guarda suas ações da rodada; quando os dois confirmam, os dois
   navegadores aplicam as ações na mesma ordem e simulam a mesma rodada. */
function fail(k,msg){if(MODE==='sync')news(msg,'bad',k);return {ok:false,msg};}
function applyAct(k,a){const mg=S.mgr[k];const t=mg.tid!=null?TM(mg.tid):null;const p=a.pid!=null?PL(a.pid):null;
  switch(a.k){
  case 'lineup':{if(!t||mg.fired)return;if(FORMS[a.form])t.form=a.form;if(V6()&&a.sl){t.sl=a.sl.slice(0,11).map(id=>id!=null&&t.pids.includes(id)?id:null);while(t.sl.length<11)t.sl.push(null);t.xi=t.sl.filter(x=>x!=null);t.bench=(a.bench||[]).filter(id=>t.pids.includes(id)&&!t.xi.includes(id)).slice(0,7);t.post=clamp(a.post|0,0,2);return;}t.post=clamp(a.post|0,0,2);t.xi=(a.xi||[]).filter(id=>t.pids.includes(id)).slice(0,11);t.bench=(a.bench||[]).filter(id=>t.pids.includes(id)&&!t.xi.includes(id)).slice(0,7);return;}
  case 'bid':{if(!t||mg.fired)return fail(k,'Você está sem clube.');if(!p||p.t!==a.from||isHuman(p.t))return fail(k,`Negócio não concluído: ${p?p.n:'o jogador'} já não está no clube.`);
    const r=evalBid(mg,p,a.amt);if(!r.ok){if(MODE==='sync')news(`Negócio por ${p.n} não concluído: ${r.msg}`,'bad',k);return r;}
    const from=TM(p.t).name;movePlayer(p.id,t.id,a.amt);news(`Contratação: ${p.n} chega do ${from} por ${money(a.amt)}.`,'job',k);return {ok:true};}
  case 'sale':{if(p&&t&&p.t===t.id){p.sale=!!a.on;if(!p.sale)mg.offers=mg.offers.filter(o=>o.pid!==p.id);}return;}
  case 'oacc':{const o=mg.offers.find(x=>x.id===a.oid);if(!o||!t)return fail(k,'A proposta expirou.');const q=PL(o.pid);
    if(!q||q.t!==t.id)return fail(k,'A proposta expirou.');if(t.pids.length<=16)return fail(k,'O elenco precisa ter pelo menos 16 jogadores.');
    if(TM(o.from).cash<o.amt*.5){mg.offers=mg.offers.filter(x=>x!==o);return fail(k,`O ${TM(o.from).name} desistiu da compra de ${q.n}.`);}
    movePlayer(q.id,o.from,o.amt);news(`Venda: ${q.n} vai para o ${TM(o.from).name} por ${money(o.amt)}.`,'',k);return {ok:true};}
  case 'orej':{mg.offers=mg.offers.filter(x=>x.id!==a.oid);return;}
  case 'rel':{if(!p||!t||p.t!==t.id)return;if(t.pids.length<=16)return fail(k,'O elenco precisa ter pelo menos 16 jogadores.');
    t.cash-=p.sal*3;mg.fin.sal-=p.sal*3;t.pids=t.pids.filter(x=>x!==p.id);t.xi=t.xi.filter(x=>x!==p.id);t.bench=t.bench.filter(x=>x!==p.id);mg.offers=mg.offers.filter(o=>o.pid!==p.id);news(`${p.n} foi dispensado pelo ${t.name}.`,'');delete S.P[p.id];return {ok:true};}
  case 'setpos':{if(p&&POSL[a.dp]){p.dp=a.dp;p.sp=(a.sp||[]).filter(x=>POSL[x]&&x!==a.dp).slice(0,2);p.p=SECT[p.dp];}return;}
  case 'rename':{if(p){const n=String(a.n||'').trim().slice(0,30);if(n)p.n=n;}return;}
  case 'tk':{if(t)t.ticket=clamp(a.v|0,5,300);return;}
  case 'loan':{if(t&&t.loan+5e6<=t.rep*3e5){t.loan+=5e6;t.cash+=5e6;news(`O ${t.name} pegou R$ 5 mi emprestados.`,'',k);}return;}
  case 'repay':{if(t){const v=Math.min(5e6,t.loan);if(v>0&&t.cash>=v){t.loan-=v;t.cash-=v;}}return;}
  case 'expand':{if(t&&t.cash>=5e6&&t.cap<90000){t.cash-=5e6;mg.fin.obr-=5e6;t.cap+=2000;news(`${t.std} ampliado para ${num(t.cap)} lugares.`,'',k);}return;}
  case 'job':{if(mg.jobs.some(j=>j.tid===a.tid)&&!isHuman(a.tid)){takeJob(mg,k,a.tid);return {ok:true};}return fail(k,'O convite não está mais disponível.');}
  case 'jrej':{mg.jobs=mg.jobs.filter(j=>j.tid!==a.tid);return;}
  case 'fpick':{if(!mg.fired)return;if((mg.firedOffers||[]).includes(a.tid)&&!isHuman(a.tid)){mg.rep=clamp(mg.rep-10,1,100);takeJob(mg,k,a.tid);return {ok:true};}
    mg.firedOffers=firedOffers(mg);return fail(k,'Esse clube já contratou outro técnico. Veja as novas propostas.');}
  case 'autosub':{mg.autoSub=!!a.v;return;}
  }}
function canEdit(){if(ONLINE()&&UI.on.sent){toast('Você já confirmou a rodada. Aguarde o adversário.');return false;}return true;}
function doAct(a){if(!canEdit())return {ok:false,msg:''};MODE='preview';const r=applyAct(UI.me,a)||{ok:true};
  if(r.ok!==false){if(ONLINE()){UI.on.pending.push(a);saveOnline();}else save();}return r;}

/* ====================== FIM DE TEMPORADA ====================== */
function sortedTable(d){return S.teams.filter(t=>t.div===d).sort((a,b)=>b.tb.pts-a.tb.pts||b.tb.v-a.tb.v||(b.tb.gp-b.tb.gc)-(a.tb.gp-a.tb.gc)||b.tb.gp-a.tb.gp||cmpName(a,b));}
function topScorer(d){return Object.values(S.P).filter(p=>TM(p.t).div===d&&p.gl>0).sort((a,b)=>b.gl-a.gl||a.id-b.id)[0];}
function seasonEnd(){
  const tabs=[0,1,2].map(sortedTable);const champ=tabs.map(t=>t[0].id);
  const scorers=[0,1,2].map(topScorer).map(p=>p?`${p.n} (${TM(p.t).short}) ${p.gl}`:'-');
  const prizes=[[3e7,2e6],[5e6,4e5],[1.5e6,1e5]];

  const up1=tabs[1].slice(0,4),up2=tabs[2].slice(0,4),dn0=tabs[0].slice(16),dn1=tabs[1].slice(16);
  if(S.v>=3){const q=[];if(S.cup.champ!=null&&TM(S.cup.champ).div<=2&&!dn0.some(t=>t.id===S.cup.champ))q.push(S.cup.champ);for(const t of tabs[0]){if(q.length>=6)break;if(!q.includes(t.id)&&!dn0.includes(t))q.push(t.id);}S.libNext=q;}
  const ftabs={};if(S.v>=4)LCODES.forEach(c=>{const ids=S.teams.filter(t=>t.div===c);if(!ids.length)return;const played=ids.some(t=>t.tb.j>0);
    const tab=played?sortedTable(c):ids.slice().sort((a,b)=>b.rep-a.rep||a.id-b.id);ftabs[c]=tab;const P=LGS[c];
    tab.forEach((t,i)=>{const pr=(tab.length-i)*P.pr[1]+(i===0?P.pr[0]:0);t.cash+=pr;const k=mgrIdx(t.id);if(k>=0)S.mgr[k].fin.pre+=pr;if(!isHuman(t.id))t.rep=clamp(t.rep+(8-i)*.2,30,99);});});
  if(S.v>=4){const eu=S.teams.filter(t=>t.div===4).map(t=>t.id);LCODES.forEach(c=>{if(LGS[c].ucl&&ftabs[c])ftabs[c].slice(0,LGS[c].ucl).forEach(t=>eu.push(t.id));});S.uclNext=eu;
    const sa=S.teams.filter(t=>t.div===3).map(t=>t.id);if(ftabs[16])ftabs[16].slice(0,6).forEach(t=>sa.push(t.id));S.libForNext=sa;
    S.lgChamp={};LCODES.forEach(c=>{if(ftabs[c]&&ftabs[c][0].tb.j>0)S.lgChamp[c]=ftabs[c][0].id;});}
  const per=S.mgr.map(mg=>{if(mg.tid==null||mg.fired)return {pos:null,div:null,verdict:'Você terminou a temporada sem clube.'};const ut=TM(mg.tid);
    const pos=(ut.div<=2?tabs[ut.div]:(ftabs[ut.div]||sortedTable(ut.div))).findIndex(t=>t.id===ut.id)+1;const exp=expectedPos(ut);
    let dc=(exp-pos)*1.5;if(pos===1){dc+=30;awardTitle(mg,`${divName(ut.div)} ${S.year}`,ut.div<=2?[3e7,5e6,1.5e6][ut.div]+20*[2e6,4e5,1e5][ut.div]:LGS[ut.div].pr[0]+(ftabs[ut.div]||[]).length*LGS[ut.div].pr[1]);mg.rep+=ut.div<=2?[15,8,5][ut.div]:12;}

  const gems=[];S.teams.forEach(t=>{const used=new Set(t.pids.map(i=>PL(i).n));const hu=isHuman(t.id);const n=hu?2:ri(1,3);for(let i=0;i<n;i++){const y=youth(t,used);if(y.gem&&isLeague(t)){gems.push(y);news(`Joia revelada: ${y.n}, ${y.a} anos, ${POSL[y.dp]||''} da base do ${t.name}.`,'job');}}

    else if(cnt.G<2){const np=mkP(genNameP(used,t.pool),'G',baseF(t)-8,ri(20,28),t.id);t.pids.push(np.id);if(V6())np.dp='GOL',np.sp=[];}
    t.pids.forEach(id=>{const p=PL(id);p.sal=Math.max(p.sal,Math.round(salFor(p)*.8/1000)*1000);});});
  S.mgr.forEach(mg=>{mg.offers=[];mg.jobs=[];});
  S.lastSummary={y:S.year,champ,cup:S.cup.champ,lg:S.lgChamp||null,lib:S.lib?S.lib.champ:null,ucl:S.ucl?S.ucl.champ:null,mun:S.mun?S.mun.champ:null,up1:up1.map(t=>t.id),up2:up2.map(t=>t.id),dn0:dn0.map(t=>t.id),dn1:dn1.map(t=>t.id),scorers,per,retired:retired.length,retNames:retired.slice().sort((a,b)=>b.f-a.f).slice(0,8).map(p=>`${p.n} (${TM(p.t)?TM(p.t).short:''}, ${p.a} anos)`),gems:(typeof gems!=='undefined'?gems:[]).slice(0,8).map(p=>`${p.n} (${TM(p.t).short}, ${p.dp||''})`)};
  S.year++;S.mgr.forEach(mg=>mg.seasons++);newSeason();
  S.mgr.forEach((mg,k)=>{if(mg.fired){mg.firedOffers=firedOffers(mg);return;}if(mg.tid!=null)autoLineup(TM(mg.tid));
    if(mg.rep>55&&R()<.5){const c=S.teams.filter(x=>!isHuman(x.id)&&(S.v>=4?isLeague(x):isDom(x))&&x.rep>TM(mg.tid).rep+3&&x.rep<=mg.rep+22);if(c.length){const j=pick(c);mg.jobs.push({tid:j.id,exp:S.md+3});news(`Convite: o ${j.name} quer contratar você para ${S.year}.`,'job',k);}}});

function newWC(name,ni){const seed=Math.floor(Math.random()*2147483646)+1;
  S={v:6,mode:'wc',seed,rng:seed,year:2026,md:0,turn:0,nid:1,P:{},teams:[],mgr:[],news:[],history:[],lastSummary:null};

  const gfx=[[],[],[]];groups.forEach((g,gi)=>groupRounds(g).slice(0,3).forEach((r,k)=>r.forEach(([h,a])=>gfx[k].push(mkFx(h,a,{c:8,gr:gi,n:true})))));
  S.wc={groups,gfx,ko:[],champ:null,vice:null,third:null,done:false};

function wcFix(s){return s<3?S.wc.gfx[s]:(S.wc.ko[s-3]||[]);}
function advanceWC(s){const W=S.wc;
  if(s===2){const first=[],second=[],third=[];W.groups.forEach(g=>{const o=sortTb(g,Object.fromEntries(g.map(id=>[id,TM(id).tb])));first.push(o[0]);second.push(o[1]);third.push(o[2]);});
    const rk=ids=>ids.slice().sort((a,b)=>{const x=TM(a).tb,y=TM(b).tb;return y.pts-x.pts||(y.gp-y.gc)-(x.gp-x.gc)||y.gp-x.gp||cmpName(TM(a),TM(b));});
    const sec=rk(second),thr=rk(third).slice(0,8);const top=rk(first).concat(sec.slice(0,4));const bot=shuffle(sec.slice(4).concat(thr));
    const grpOf=id=>TM(id).grp;const r=[];
    for(const a of top){let j=bot.findIndex(b=>grpOf(b)!==grpOf(a));if(j<0)j=0;r.push(mkFx(a,bot[j],{c:8,ko:true,n:true,et:true}));bot.splice(j,1);}
    // chaveamento: 1º contra 16º, 2º contra 15º... para os melhores se cruzarem só no fim
    const ord=[0,15,7,8,3,12,4,11,1,14,6,9,2,13,5,10];W.ko[0]=ord.map(i=>r[i]);
    const out=W.groups.flat().filter(id=>!top.includes(id)&&!sec.includes(id)&&!thr.includes(id));
    S.mgr.forEach((mg,k)=>{if(out.includes(mg.tid))news(`A ${TM(mg.tid).name} foi eliminada na fase de grupos.`,'bad',k);else if(mg.tid!=null)news(`A ${TM(mg.tid).name} está classificada para os 16 avos de final!`,'job',k);});}
  if(s>=3&&s<=5){const w=W.ko[s-3].map(f=>f.w);W.ko[s-2]=koPairs(w,{c:8,n:true,et:true});}
  if(s===6){const sf=W.ko[3];const w=sf.map(f=>f.w),l=sf.map(f=>f.w===f.h?f.a:f.h);W.ko[4]=[mkFx(w[0],w[1],{c:8,ko:true,n:true,et:true,fin:true}),mkFx(l[0],l[1],{c:8,ko:true,n:true,et:true,third:true})];}
  if(s>=3){W.ko[s-3].forEach(f=>{const l=f.w===f.h?f.a:f.h;S.mgr.forEach((mg,k)=>{if(mg.tid===l&&!f.third&&!f.fin)news(`A ${TM(l).name} foi eliminada nas ${WCST[s].toLowerCase()}.`,'bad',k);});});}
  if(s===7){const f=W.ko[4][0],t3=W.ko[4][1];W.champ=f.w;W.vice=f.w===f.h?f.a:f.h;W.third=t3.w;W.done=true;
    const top=Object.values(S.P).filter(p=>p.gl>0).sort((a,b)=>b.gl-a.gl||a.gm-b.gm)[0];
    news(`${TM(W.champ).name} é campeã da Copa do Mundo 2026!`,'job');
    S.lastSummary={wc:true,y:2026,champ:W.champ,vice:W.vice,third:W.third,top:top?`${top.n} (${TM(top.t).short}) ${top.gl} gols`:'-'};}
}
function wcResultTxt(tid){const W=S.wc;if(W.champ===tid)return 'Campeã do mundo!';if(W.vice===tid)return 'Vice-campeã';if(W.third===tid)return 'Terceiro lugar';
  for(let s=W.ko.length-1;s>=0;s--){const f=(W.ko[s]||[]).find(x=>x.h===tid||x.a===tid);if(f){if(f.w==null)return `Disputando: ${WCST[s+3]}`;if(f.third)return 'Quarto lugar';return `Eliminada nas ${WCST[s+3].toLowerCase()}`;}}

function attendanceEst(t){const fans=t.rep*t.rep*9;const ref=LGP(t.div).tk;const pf=clamp(Math.pow(ref/Math.max(1,t.ticket),1.15),.12,1.6);return Math.round(fans*pf);}

function coachName(t){const P=NP[t.pool];const h=parseInt(hashStr(S.seed+':tec:'+t.id),36);const f=P?P.f:FIRST,l=P?P.l:LAST;return P&&P.rev?`${l[h%l.length]} ${f[(h>>>6)%f.length]}`:`${f[h%f.length]} ${l[(h>>>6)%l.length]}`;}
function coachRows(){const ai={};const at=(h,tid)=>(h.us||[]).some(u=>u&&u.tid===tid);const add=(tid,n,h)=>{if(tid==null||(h&&at(h,tid))||isHuman(tid)&&!h)return;(ai[tid]=ai[tid]||[]).push(n);};
  S.history.forEach(h=>{add(h.A,'Série A '+h.y,h);add(h.B,'Série B '+h.y,h);add(h.C,'Série C '+h.y,h);add(h.cup,'Copa do Brasil '+h.y,h);add(h.lib,'Libertadores '+h.y,h);add(h.ucl,'Champions League '+h.y,h);add(h.mun,'Mundial de Clubes '+h.y,h);
    if(h.lg)Object.entries(h.lg).forEach(([c,id])=>add(id,LGS[c].n+' '+h.y,h));});
  add(S.cup&&S.cup.champ,'Copa do Brasil '+S.year);if(S.lib){add(S.lib.champ,'Libertadores '+S.year);add(S.ucl.champ,'Champions League '+S.year);add(S.mun.champ,'Mundial de Clubes '+S.year);}
  const form=t=>t.tb&&t.tb.j?t.tb.pts/(t.tb.j*3):null;const rows=[];
  S.teams.filter(isLeague).forEach(t=>{if(isHuman(t.id)&&!S.mgr[mgrIdx(t.id)].fired)return;const ti=ai[t.id]||[];const f=form(t);rows.push({name:coachName(t),tid:t.id,titles:ti,rep:Math.round(t.rep*.8),form:f,pts:ti.reduce((a,n)=>a+titleW(n),0)+t.rep*.4+(f||0)*20});});
  S.mgr.forEach((mg,k)=>{const t=mg.tid!=null&&!mg.fired?TM(mg.tid):null;const f=t?form(t):null;rows.push({name:mg.name,tid:t?t.id:null,titles:mg.titles,rep:Math.round(mg.rep),form:f,pts:mg.titles.reduce((a,n)=>a+titleW(n),0)+mg.rep*.4+(f||0)*20,human:k});});
  return rows.sort((a,b)=>b.pts-a.pts||b.titles.length-a.titles.length||(a.name<b.name?-1:1));}

  ltab:v=>{UI.live.tab=+v;render();},
  lmatch:v=>matchModal(+v),
  dosub:()=>{const L=UI.live;const m=L.ms.find(x=>x.mine);const i=m.s[0].user?0:1;const o=+($('#sout')||{}).value,n=+($('#sin')||{}).value;
    if(!o||!n){toast('Escolha quem sai e quem entra.');return;}if(m.s[i].subs>=5){toast('Limite de 5 trocas.');return;}doSub(m,i,o,n,L.min);renderLive();subsModal();},
  closesub:()=>{const L=UI.live;const m=L.ms.find(x=>x.mine);const i=m.s[0].user?0:1;const ps=$('#spost');if(ps){m.s[i].post=+ps.value;UT().post=m.s[i].post;}closeModal();if(L.min>0&&!L.done){L.paused=false;L.banner='';scheduleTick();}renderLive();},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(ACT[a]){if(el.tagName==='A')e.preventDefault();ACT[a](el.dataset.v,el,e);}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('mrow'))ACT.lmatch(e.target.dataset.v);if(e.key==='Escape'&&$('#modal').innerHTML&&$('#modal .ov[data-a]'))closeModal();});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;const v=e.target.value;
  if(c==='form'){if(!canEdit()){render();return;}const t=UT();t.form=v;autoLineup(t);persistSoon();render();toast(`Esquema ${v}: time reescalado.`);}
  else if(c==='post'){if(!canEdit()){render();return;}UT().post=+v;persistSoon();render();}
  else if(c==='half'){CFG.halfStop=e.target.checked;saveCfg();}
  else if(c==='asub'){doAct({k:'autosub',v:e.target.checked});}
  else if(c==='pool'){UI.pool=v;}
  else if(c==='timer'){UI.timer=+v;}
  else if(c==='gtimer'&&UI.on){DB.doc('games/'+UI.on.gid).update({timer:+v}).then(()=>toast('Tempo atualizado para os dois.'),e=>toast(dbErr(e)));}
  else if(c==='elsort'){UI.el.sort=v;render();}
  else if(c==='msort'){UI.mkt.sort=v;render();}
  else if(c==='mamin'){UI.mkt.amin=v;render();}else if(c==='mamax'){UI.mkt.amax=v;render();}else if(c==='mfmin'){UI.mkt.fmin=v;render();}else if(c==='mgrow'){UI.mkt.grow=v;render();}
  else if(c==='mp'){UI.mkt.pos=v;render();}else if(c==='md'){UI.mkt.div=v;render();}else if(c==='mm'){UI.mkt.max=v;render();}});
let mqT;document.addEventListener('input',e=>{if(e.target.dataset.c==='mq'){UI.mkt.q=e.target.value;clearTimeout(mqT);mqT=setTimeout(()=>{render();const i=$('#mq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},350);}
  else if(e.target.id==='mgr'){UI.mgr=e.target.value;}});

/* ====================== INÍCIO ====================== */
function start(data){
  if(data&&data.gid){UI.resumeGid=data.gid;}
  else{try{if(data&&data.s){S=JSON.parse(data.s);UI.me=0;UI.screen=data.screen==='start'?'start':'hub';UI.tab=data.tab||'elenco';}}catch(e){S=null;}}
  render();if(S&&UI.screen==='hub')afterModals();
  initCaps();
}
window.claude?.hot?.snapshot?.(()=>ONLINE()?{gid:UI.on.gid}:{s:UI.screen==='live'?UI.backup:(S?JSON.stringify(S):null),screen:UI.screen==='live'||UI.screen==='wait'?'hub':UI.screen,tab:UI.tab});
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
