<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futebol Brasil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Barlow+Condensed:wght@500;600;700&family=Bungee&display=swap" rel="stylesheet">
<style>
/* Layout: uma janela de PC anos 90 sobre um gramado listrado — barra de título, menu de botões biselados, painéis afundados com tabelas condensadas */
:root{
  --desk:#0c5a38; --desk2:#0f6842;
  --win:#d4d0c8; --win-lt:#ffffff; --win-sh:#808080; --win-dk:#3a3a3a; --win-pr:#c4c0b7;
  --paper:#ffffff; --row:#f2f0ea; --line:#e0ddd4;
  --ink:#141414; --muted:#57534a;
  --azul:#002776; --verde:#009c3b; --amarelo:#ffdf00; --alerta:#b3121b; --me:#fff2a8; --rv:#dcebff; --warn:#ffe1e1;
  --f-display:'Bungee',Impact,'Arial Black',sans-serif;
  --f-body:'Archivo',Tahoma,Verdana,sans-serif;
  --f-data:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--desk);background-image:repeating-linear-gradient(90deg,var(--desk) 0 90px,var(--desk2) 90px 180px);color:var(--ink);font:14px/1.4 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.app{max-width:1140px;margin:0 auto}
.win{background:var(--win);border:2px solid;border-color:var(--win-lt) var(--win-dk) var(--win-dk) var(--win-lt);box-shadow:1px 1px 0 #000}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 8px;background:linear-gradient(90deg,var(--azul),#1b56b4 55%,var(--verde));color:#fff;font-weight:700;font-size:13px}
.logo{font-family:var(--f-display);letter-spacing:.04em;color:var(--amarelo);font-weight:400}
.btn{font:600 13px/1.1 var(--f-body);color:var(--ink);background:var(--win);border:2px solid;border-color:var(--win-lt) var(--win-dk) var(--win-dk) var(--win-lt);padding:5px 10px;cursor:pointer;min-height:30px;border-radius:0}
.btn:active,.btn.on{border-color:var(--win-dk) var(--win-lt) var(--win-lt) var(--win-dk);background:var(--win-pr)}
.btn:focus-visible,.tb:focus-visible,.mrow:focus-visible{outline:1px dotted #000;outline-offset:-4px}
.btn:disabled{color:var(--win-sh);text-shadow:1px 1px 0 #fff;cursor:default}
.btn.go{background:var(--verde);color:#fff;font:400 15px/1 var(--f-display);letter-spacing:.03em;padding:8px 14px}
.btn.go:disabled{background:var(--win);color:var(--win-sh)}
.btn.warn{color:var(--alerta)}
.btn.sm{min-height:24px;padding:2px 7px;font-size:12px}
.sunk{background:var(--paper);border:2px solid;border-color:var(--win-sh) var(--win-lt) var(--win-lt) var(--win-sh)}
.grp{border:1px solid var(--win-sh);box-shadow:1px 1px 0 var(--win-lt) inset,1px 1px 0 var(--win-lt);padding:12px 10px 10px;position:relative;margin-top:10px}
.grp>.lg{position:absolute;top:-9px;left:8px;background:var(--win);padding:0 4px;font-weight:700;font-size:12px}
.menu{display:flex;flex-wrap:wrap;gap:3px;padding:6px;border-bottom:1px solid var(--win-sh)}
.menu .btn{font-size:12.5px}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;background:var(--alerta);color:#fff;font-size:11px;text-align:center}
.content{padding:10px;min-height:420px}
.stat{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.3fr);gap:10px;padding:10px;border-bottom:1px solid var(--win-sh)}
.stat>div{min-width:0}
.kv{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.kv b{font-family:var(--f-data);font-size:17px;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.meter{height:12px;width:100%;max-width:220px;padding:1px}
.meter i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--verde) 0 8px,transparent 8px 10px)}
.meter.low i{background:repeating-linear-gradient(90deg,var(--alerta) 0 8px,transparent 8px 10px)}
.next{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.vs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--f-data);font-weight:700}
.sbar{display:flex;gap:3px;padding:3px;border-top:1px solid var(--win-lt);flex-wrap:wrap}
.sbar>span{padding:1px 8px;font-size:12px;border:1px solid;border-color:var(--win-sh) var(--win-lt) var(--win-lt) var(--win-sh)}
.scroll{overflow-x:auto;max-width:100%}
table.grid{border-collapse:collapse;width:100%;font-family:var(--f-data);font-size:15px;font-variant-numeric:tabular-nums;background:var(--paper)}
.grid th{background:var(--win);text-align:left;font-weight:700;border:1px solid var(--win-sh);padding:2px 6px;white-space:nowrap;font-size:14px}
.grid td{padding:2px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid tr:nth-child(even) td{background:var(--row)}
.grid tr.me td{background:var(--me)}
.grid tr.rv td{background:var(--rv)}
.grid tr.warn td{background:var(--warn)}
.grid td.n,.grid th.n{text-align:right}
.grid td.c,.grid th.c{text-align:center}
.grid tr.click{cursor:pointer}
.grid tr.click:hover td{background:#dfe8ff}
.tb{display:inline-block;min-width:12.5ch;padding:1px 6px;font-family:var(--f-data);font-weight:700;font-size:14px;letter-spacing:.03em;text-transform:uppercase;border:1px solid #000;line-height:1.35;white-space:nowrap;text-align:left}
.tb.me{outline:2px solid var(--amarelo);outline-offset:1px}
.tb.sm{min-width:0;font-size:12.5px;padding:0 4px}
.zone-l{box-shadow:inset 4px 0 0 var(--verde)}
.zone-up{box-shadow:inset 4px 0 0 var(--azul)}
.zone-dn{box-shadow:inset 4px 0 0 var(--alerta)}
.dots i{display:inline-block;width:9px;height:9px;margin-right:2px;border:1px solid #0004}
.dots .V{background:var(--verde)}.dots .E{background:#a8a39a}.dots .D{background:var(--alerta)}
.pos{display:inline-block;width:20px;text-align:center;font-weight:700;color:#fff}
.pos.G{background:#7a5a00}.pos.D{background:#1f4e9c}.pos.M{background:#0f7a3c}.pos.A{background:#b3121b}
.st{display:inline-block;width:26px;font-weight:700;padding:1px 0;text-align:center;cursor:pointer;border:2px solid;border-color:var(--win-lt) var(--win-dk) var(--win-dk) var(--win-lt);background:var(--win);font-family:var(--f-data)}
.st.T{background:var(--verde);color:#fff}.st.R{background:var(--amarelo)}
.tag{display:inline-block;font-size:12px;padding:0 4px;border:1px solid currentColor;margin-right:3px}
.tag.inj{color:var(--alerta)}.tag.sus{color:#7a3b00}.tag.sale{color:var(--azul)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.cols>*{min-width:0}
h2{font:400 18px/1.2 var(--f-display);margin:0 0 8px;letter-spacing:.02em;text-wrap:balance;color:var(--azul)}
h3{font-size:14px;margin:12px 0 6px}
.muted{color:var(--muted)}
.small{font-size:12px}
input,select{font:14px var(--f-body);padding:4px 6px;border:2px solid;border-color:var(--win-sh) var(--win-lt) var(--win-lt) var(--win-sh);background:var(--paper);color:var(--ink);border-radius:0;min-height:30px;max-width:100%}
textarea{font:12px/1.3 ui-monospace,Consolas,monospace;width:100%;min-height:90px;border:2px solid;border-color:var(--win-sh) var(--win-lt) var(--win-lt) var(--win-sh);background:var(--paper);color:var(--ink)}
.news{display:flex;flex-direction:column;gap:0}
.news>div{padding:6px 8px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.news .when{font-family:var(--f-data);color:var(--muted);min-width:64px}
.news .txt{flex:1;min-width:0}
.news .k-ofr{background:#eef6ff}.news .k-job{background:#fff8d6}.news .k-bad{background:#ffecec}
/* início */
.hero{padding:22px 16px 18px;text-align:center;background:linear-gradient(180deg,var(--verde),#007a2f);border-bottom:3px solid var(--amarelo);color:#fff}
.hero h1{font:400 clamp(30px,8vw,64px)/1 var(--f-display);margin:0;color:var(--amarelo);text-shadow:3px 3px 0 var(--azul);letter-spacing:.02em}
.hero p{margin:8px 0 0;font-family:var(--f-data);font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.picker .tb{width:100%;cursor:pointer;padding:5px 8px}
.picker .tb.sel{outline:3px solid var(--azul);outline-offset:1px}
.wcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wcg>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.wcg .tb{width:100%;cursor:pointer;padding:4px 8px}
.wcg .tb.sel{outline:3px solid var(--azul);outline-offset:1px}
/* ao vivo */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px;background:#0b1d12;color:#f5f5f5;border:2px solid;border-color:var(--win-sh) var(--win-lt) var(--win-lt) var(--win-sh)}
.board .side{display:flex;flex-direction:column;gap:4px;min-width:0;align-items:flex-start}
.board .side.r{align-items:flex-end;text-align:right}
.board .sc{font:700 54px/1 var(--f-data);color:var(--amarelo);font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.04em}
.board .mn{font:600 15px var(--f-data);text-align:center;color:#9fe0b4}
.board .tb{font-size:18px}
.feed{max-height:180px;overflow:auto;font-family:var(--f-data);font-size:15px;padding:4px 8px}
.feed div{padding:1px 0}
.ev{display:inline-block;min-width:34px;text-align:center;font-size:11px;font-weight:700;padding:0 3px;margin-right:6px;border:1px solid #0005}
.ev.goal{background:var(--verde);color:#fff}.ev.yc{background:var(--amarelo)}.ev.rc{background:var(--alerta);color:#fff}.ev.inj{background:#fff;color:var(--alerta)}.ev.sub{background:#cfd8ea}.ev.et{background:var(--azul);color:#fff}.ev.pen{background:var(--azul);color:#fff}
.mlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:0 12px}
.mrow{display:grid;grid-template-columns:auto 52px auto minmax(0,1fr);gap:6px;align-items:center;padding:3px 6px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--paper)}
.mrow .sc{font:700 18px var(--f-data);text-align:center;font-variant-numeric:tabular-nums}
.mrow .last{font-family:var(--f-data);font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.mine{background:var(--me)}
.mrow.rvm{background:var(--rv)}
.mrow.flash{animation:fl 1.2s steps(2) 2}
@keyframes fl{0%{background:var(--amarelo)}100%{background:var(--paper)}}
@media (prefers-reduced-motion:reduce){.mrow.flash{animation:none;background:var(--amarelo)}}
.banner{padding:6px 10px;background:var(--amarelo);font-weight:700;border-bottom:1px solid var(--win-sh)}
/* modal */
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov .win{width:min(640px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column}
.ov .body{padding:12px;overflow:auto}
.ov .foot{display:flex;gap:6px;justify-content:flex-end;padding:8px 12px;border-top:1px solid var(--win-sh);flex-wrap:wrap}
.x{background:var(--win);color:var(--ink);border:2px solid;border-color:var(--win-lt) var(--win-dk) var(--win-dk) var(--win-lt);width:22px;height:20px;font:700 12px var(--f-body);cursor:pointer;padding:0;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:8px 14px;z-index:60;font-weight:600;max-width:calc(100% - 32px)}
.trophy{font-family:var(--f-data);font-weight:700}
@media (max-width:820px){.stat{grid-template-columns:1fr}.board .sc{font-size:40px}.board .tb{font-size:15px;min-width:0}}
@media (max-width:520px){.mrow{grid-template-columns:auto 44px auto}.mrow .last{display:none}.mrow .tb{min-width:10ch;font-size:13px}}
</style>

</head>

function value(p){const af=p.a<=21?1.45:p.a<=25?1.2:p.a<=29?1:p.a<=32?.7:p.a<=34?.45:.25;const m=S&&S.v>=4?riskF(p).t:1;return Math.max(20000,Math.round(Math.pow(Math.max(p.f-35,1)/10,3.6)*120000*af*m/10000)*10000);}
// lesões frequentes e excesso de cartões derrubam o preço; gols acima do esperado para a posição sobem
function riskF(p){const j=Math.max(12,p.tj||0);const inj=((p.ti||0)+(p.tmi||0)/3)/j;const fi=clamp(1-inj*1.5,.55,1);
  const c=((p.ty||0)+3*(p.tr||0))/j;const fc=clamp(1-Math.max(0,c-.2)*.6,.85,1);let fp=1;
  if((p.tj||0)>=10&&(p.p==='A'||p.p==='M')){const ex=p.p==='A'?.35:.12;fp=clamp(1+((p.tgj||0)/p.tj-ex)*.8,.85,1.25);}return {fi,fc,fp,t:fi*fc*fp};}
function salFor(p){return Math.max(4000,Math.round(Math.pow(Math.max(p.f-35,1)/10,3.6)*120000*.02/1000)*1000);}
function genName(used){for(let k=0;k<50;k++){const n=R()<.3?pick(NICK):pick(FIRST)+' '+pick(LAST);if(!used.has(n)){used.add(n);return n;}}return pick(FIRST)+' '+pick(LAST)+' '+ri(2,9);}
function mkP(n,pos,f,a,tid){const p={id:S.nid++,n,p:pos,f:clamp(Math.round(f),25,96),a,t:tid,inj:0,sus:0,ps:0,yc:0,gl:0,gm:0,tg:0,sale:false};p.sal=salFor(p);if(S.v>=4){p.fr=Math.round((.5+R()+(R()<.12?R()*1.2:0))*100)/100;p.ag=Math.round((.5+R()+(R()<.1?R():0))*100)/100;}S.P[p.id]=p;return p;}

function buildSquad(t,str,needOv){
  const used=new Set();
  if(str){for(const raw of str.split(';')){const tk=raw.trim().split(/\s+/);if(tk.length<3)continue;const pos=tk[0];let f,a,end=tk.length;
    if(/^\d+$/.test(tk[end-1])&&/^\d+$/.test(tk[end-2])){a=+tk[end-1];f=+tk[end-2];end-=2;}else{f=+tk[end-1];a=pos==='G'?ri(22,34):ri(20,32);end-=1;}
    const n=tk.slice(1,end).join(' ');used.add(n);t.pids.push(mkP(n,pos,f,a,t.id).id);}}
  const need=needOv||{G:3,D:8,M:8,A:5};const have={G:0,D:0,M:0,A:0};t.pids.forEach(id=>have[PL(id).p]++);
  const bf=baseF(t);const isNew=!str;
  for(const pos of ['G','D','M','A']){let k=0;while(have[pos]<need[pos]){const starter=have[pos]<({G:1,D:4,M:4,A:2})[pos];const f=starter?bf+ri(-4,5)+(R()<.12?ri(4,8):0):bf-(str?ri(6,14):ri(3,12));t.pids.push(mkP(genNameP(used,t.pool),pos,f,pos==='G'?ri(20,34):ri(18,33),t.id).id);have[pos]++;k++;}}
}

function newWorld(seed,ver){
  S={v:ver||2,seed,rng:seed|0,year:2026,md:0,turn:0,nid:1,P:{},teams:[],mgr:[],news:[],history:[],lastSummary:null};

    t.cash=Math.round(t.rep*t.rep*[6000,3000,1500][t.div]/1e5)*1e5;S.teams.push(t);buildSquad(t,d[9]);});
  if(S.v>=4)addWorldV4();else if(S.v>=3)addExtTeams();

function newSeason(){
  S.md=0;S.teams.forEach(t=>t.tb={j:0,v:0,e:0,d:0,gp:0,gc:0,pts:0,f:[]});
  Object.values(S.P).forEach(p=>{p.gl=0;p.gm=0;p.yc=0;p.sus=0;p.ps=0;p.inj=0;delete p.cs;});

  const cupT=S.teams.filter(t=>t.div===0).map(t=>t.id).concat(S.teams.filter(t=>t.div===1).sort((a,b)=>b.rep-a.rep||a.id-b.id).slice(0,12).map(t=>t.id));
  shuffle(cupT);const r0=[];for(let i=0;i<32;i+=2)r0.push({h:cupT[i],a:cupT[i+1],hg:null,ag:null});
  S.cup={rounds:[r0],champ:null,vice:null};
  const v3=S.v>=3;if(v3)newContinental();

    if(v3){const xi=XAFTER.indexOf(r);if(xi>=0)S.cal.push({t:'X',d:xi});if(r===MUN_AFTER)S.cal.push({t:'M'});}}

function roundRobin(ids){const n=ids.length;let arr=shuffle(ids.slice());const rounds=[];
  for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){let h=arr[i],a=arr[n-1-i];if((r+i)%2)[h,a]=[a,h];m.push({h,a,hg:null,ag:null});}rounds.push(m);arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];}
  return rounds.concat(rounds.map(m=>m.map(x=>({h:x.a,a:x.h,hg:null,ag:null}))));}

/* ====================== ESCALAÇÃO ====================== */
const avail=p=>p&&p.inj===0&&p.sus===0;
function autoLineup(t){
  const [d,m,a]=FORMS[t.form]||FORMS['4-4-2'];
  const pool=t.pids.map(PL).filter(avail).sort((x,y)=>y.f-x.f);const xi=[];const take=(pos,n)=>{for(const p of pool){if(n<=0)break;if(p.p===pos&&!xi.includes(p.id)){xi.push(p.id);n--;}}return n;};
  take('G',1);let left=take('D',d)+take('M',m)+take('A',a);
  for(const p of pool){if(left<=0)break;if(!xi.includes(p.id)&&p.p!=='G'){xi.push(p.id);left--;}}
  if(!xi.some(id=>PL(id).p==='G')){const g=pool.find(p=>!xi.includes(p.id));if(g&&xi.length<11)xi.push(g.id);}
  const rest=pool.filter(p=>!xi.includes(p.id));const bench=[];const bg=rest.find(p=>p.p==='G');if(bg)bench.push(bg.id);
  for(const p of rest){if(bench.length>=7)break;if(!bench.includes(p.id))bench.push(p.id);}
  t.xi=xi;t.bench=bench;
}
function checkLineup(t){
  const ok=id=>t.pids.includes(id)&&avail(PL(id));const before=t.xi.length;
  t.xi=t.xi.filter(ok);t.bench=t.bench.filter(id=>ok(id)&&!t.xi.includes(id));
  let changed=t.xi.length!==before;
  if(t.xi.length<11){const [d,m,a]=FORMS[t.form];const want={G:1,D:d,M:m,A:a};const cnt={G:0,D:0,M:0,A:0};t.xi.forEach(id=>cnt[PL(id).p]++);
    const pool=t.pids.map(PL).filter(p=>avail(p)&&!t.xi.includes(p.id)).sort((x,y)=>y.f-x.f);
    for(const p of pool){if(t.xi.length>=11)break;if(cnt[p.p]<want[p.p]){t.xi.push(p.id);cnt[p.p]++;t.bench=t.bench.filter(i=>i!==p.id);}}
    for(const p of pool){if(t.xi.length>=11)break;if(!t.xi.includes(p.id)&&p.p!=='G'){t.xi.push(p.id);t.bench=t.bench.filter(i=>i!==p.id);}}
    changed=true;}
  return changed;
}

/* ====================== MOTOR DE JOGO ====================== */
function strength(sd){let g=0,D=0,M=0,A=0,hasG=false;
  for(const id of sd.on){const p=PL(id);if(!p)continue;if(p.p==='G'){if(!hasG){g=p.f;hasG=true;}else D+=p.f*.5;}else if(p.p==='D')D+=p.f;else if(p.p==='M')M+=p.f;else A+=p.f;}
  if(!hasG)g=20;let atk=A+M*.5+D*.1,def=D+M*.4+g*1.5;
  if(sd.post===0){atk*=.85;def*=1.15;}else if(sd.post===2){atk*=1.15;def*=.87;}return {atk,def};}
function prepSide(tid){const t=TM(tid);const k=mgrIdx(tid);const human=k>=0&&!S.mgr[k].fired;if(!human)autoLineup(t);
  const served=t.pids.filter(id=>PL(id).sus>0);
  return {tid,on:t.xi.slice(0,11),bench:t.bench.slice(),subs:0,post:human?t.post:1,human,auto:human?S.mgr[k].autoSub||S.online:true,user:tid===myTid(),served,app:new Set(t.xi),yel:new Set(),out:new Set()};}
function mkMatch(fx,comp){const m={fx,comp,s:[prepSide(fx.h),prepSide(fx.a)],g:[0,0],ev:[],flash:0,done:false,ko:comp===3||!!fx.ko,et:!!fx.et,neu:!!fx.n};m.mine=m.s[0].user||m.s[1].user;return m;}
function addEv(m,min,type,side,txt){m.ev.push({m:min,type,side,txt});}
function pickWeighted(list,w){let tot=0;const ws=list.map(x=>{const v=w(x);tot+=v;return v;});let r=R()*tot;for(let i=0;i<list.length;i++){r-=ws[i];if(r<=0)return list[i];}return list[list.length-1];}
function bestBench(sd,pos){const b=sd.bench.map(PL).filter(p=>p&&avail(p));let c=b.filter(p=>p.p===pos);if(!c.length)c=b.filter(p=>p.p!=='G');if(!c.length)c=b;return c.sort((x,y)=>y.f-x.f)[0];}
function doSub(m,i,outId,inId,min){const sd=m.s[i];const k=sd.on.indexOf(outId);if(k<0)return false;sd.on[k]=inId;sd.bench=sd.bench.filter(x=>x!==inId);sd.subs++;sd.app.add(inId);sd.out.add(outId);
  addEv(m,min,'sub',i,`${PL(inId).n} entra, sai ${PL(outId).n}`);return true;}
function removeOn(m,i,id){const sd=m.s[i];sd.on=sd.on.filter(x=>x!==id);sd.out.add(id);}
function simMinute(m,min){
  for(let i=0;i<2;i++){const sd=m.s[i];if(sd.human)continue;const diff=m.g[i]-m.g[1-i];
    if(min>=70&&diff<0)sd.post=2;else if(min>=75&&diff>0)sd.post=0;else if(min>=60)sd.post=1;}
  const st=[strength(m.s[0]),strength(m.s[1])];
  for(let i=0;i<2;i++){const sd=m.s[i];if(!sd.on.length)continue;
    const r=st[i].atk/st[1-i].def/.62;const p=Math.min(.07,.0142*r*r*(m.neu?1:(i===0?1.1:.92)));
    if(R()<p){const sc=pickWeighted(sd.on.map(PL),p=>p.p==='A'?p.f*5:p.p==='M'?p.f*2.2:p.p==='D'?p.f*.6:p.f*.02);
      m.g[i]++;sc.gl++;sc.tg++;sc.tgj=(sc.tgj||0)+1;if(TS()){const c=sc.cs||(sc.cs={});(c[m.comp]||(c[m.comp]=[0,0]))[1]++;}m.flash=3;addEv(m,min,'goal',i,`${sc.n}`);}
    if(R()<.024){const p=S.v>=4?pickWeighted(sd.on.map(PL),x=>x.ag||1):pick(sd.on.map(PL));if(TS())p.ty=(p.ty||0)+1;if(sd.yel.has(p.id)){addEv(m,min,'rc',i,`${p.n} (2º amarelo)`);p.ps+=1;removeOn(m,i,p.id);}else{sd.yel.add(p.id);p.yc++;if(p.yc>=3){p.ps+=1;p.yc=0;}addEv(m,min,'yc',i,p.n);}}
    if(R()<.0009&&sd.on.length){const p=S.v>=4?pickWeighted(sd.on.map(PL),x=>x.ag||1):pick(sd.on.map(PL));if(TS())p.tr=(p.tr||0)+1;p.ps+=ri(1,2);addEv(m,min,'rc',i,p.n);removeOn(m,i,p.id);aiAfterLoss(m,i,p,min);}
    if(R()<.0028&&sd.on.length){const p=S.v>=4?pickWeighted(sd.on.map(PL),x=>x.fr||1):pick(sd.on.map(PL));p.inj=ri(1,5)+1;if(TS()){p.ti=(p.ti||0)+1;p.tmi=(p.tmi||0)+p.inj-1;}addEv(m,min,'inj',i,`${p.n} (${p.inj-1} rod.)`);
      if(!sd.auto){m.injPause=p.n;} // fica em campo até você trocar
      else{const b=sd.subs<5?bestBench(sd,p.p):null;if(b)doSub(m,i,p.id,b.id,min);else removeOn(m,i,p.id);}}
  }
  if(m.flash>0)m.flash--;
}
function aiAfterLoss(m,i,p,min){const sd=m.s[i];if(sd.human||sd.subs>=5)return;
  if(p.p==='G'){const g=sd.bench.map(PL).find(x=>x&&x.p==='G'&&avail(x));if(g){const out=sd.on.map(PL).filter(x=>x.p==='A').sort((a,b)=>a.f-b.f)[0]||sd.on.map(PL).filter(x=>x.p!=='G').sort((a,b)=>a.f-b.f)[0];if(out)doSub(m,i,out.id,g.id,min);}}}
function penalties(m){const s=[0,0];const kick=i=>{const g=m.s[1-i].on.map(PL).find(p=>p.p==='G');return R()<.78-(g?(g.f-65)*.004:-.05);};
  for(let k=0;k<5;k++){for(let i=0;i<2;i++)if(kick(i))s[i]++;}
  let k=0;while(s[0]===s[1]&&k<20){const a=kick(0),b=kick(1);if(a)s[0]++;if(b)s[1]++;k++;}if(s[0]===s[1])s[0]++;return s;}

/* ====================== RODADA ====================== */
function curEv(){return S.cal[S.md];}
function evLabel(ev,tid){if(ev.t==='L'){if(tid===undefined)tid=S.mgr&&S.mgr.length?myTid():null;const d=tid!=null&&TM(tid)?TM(tid).div:0;return d<=2?`${ev.r+1}ª rodada do Brasileirão`:`${ev.r+1}ª rodada da ${divName(d)}`;}if(ev.t==='C')return `Copa do Brasil · ${STAGES[ev.s]}`;
  if(ev.t==='X')return contLabel(ev.d);if(ev.t==='M')return 'Mundial de Clubes · Final';if(ev.t==='W')return `Copa do Mundo · ${WCST[ev.s]}`;return '';}
function evFixtures(ev){const o=[];if(!ev)return o;
  if(ev.t==='L'){for(let d=0;d<3;d++)S.fx[d][ev.r].forEach(fx=>o.push([fx,d]));if(S.v>=4)LCODES.forEach(c=>{const r=S.fx[c]&&S.fx[c][ev.r];if(r)r.forEach(fx=>o.push([fx,c]));});}
  else if(ev.t==='C')(S.cup.rounds[ev.s]||[]).forEach(fx=>o.push([fx,3]));
  else if(ev.t==='X')return contFix(ev.d);
  else if(ev.t==='M'){if(S.mun&&S.mun.fx)o.push([S.mun.fx,7]);}
  else if(ev.t==='W')wcFix(ev.s).forEach(fx=>o.push([fx,8]));
  return o;}
function fixtureOf(tid,ev){if(tid==null||!ev)return null;
  if(ev.t==='L'){const d=TM(tid).div;const r=S.fx[d]&&S.fx[d][ev.r];return r?r.find(f=>f.h===tid||f.a===tid)||null:null;}
  const x=evFixtures(ev).find(([f])=>f.h===tid||f.a===tid);return x?x[0]:null;}
function startMatchday(headless){
  const ev=curEv();if(!ev)return;
  const changed=S.mgr.map(mg=>mg.tid!=null&&!mg.fired?checkLineup(TM(mg.tid)):false);
  if(!headless&&changed[UI.me])toast('Escalação ajustada: jogadores indisponíveis foram trocados.');
  const ms=[];
  evFixtures(ev).forEach(([fx,c])=>ms.push(mkMatch(fx,c)));
  const mine=ms.find(m=>m.mine);
  UI.live={ms,min:0,paused:false,done:false,tab:mine?mine.comp:(ms[0]?ms[0].comp:0),ev,timer:null,banner:''};
  if(headless){const L=UI.live;while(L.min<(L.end||90)||L.min<90){stepMin(L);ms.forEach(m=>{m.injPause=null;});}endLive();return;}
  UI.backup=JSON.stringify(S);UI.screen='live';render();
}
const SPEEDS=[380,150,50,6];
function scheduleTick(){const L=UI.live;clearTimeout(L.timer);if(L.paused||L.done)return;L.timer=setTimeout(tick,SPEEDS[CFG.speed]);}
function stepMin(L){L.min++;L.ms.forEach(m=>{if(L.min<=90||m.inET)simMinute(m,L.min);});
  if(L.min===90){L.ms.forEach(m=>{if(m.et&&m.g[0]===m.g[1]){m.inET=true;L.end=120;addEv(m,90,'et',0,'Empate: vai para a prorrogação');}});}}
function tick(){const L=UI.live;if(!L||L.paused||L.done)return;
  stepMin(L);
  if(L.min===45&&CFG.halfStop&&L.ms.some(m=>m.mine)){L.paused=true;L.banner=ONLINE()?'Intervalo. Toque em Retomar para o 2º tempo.':'Intervalo. Faça substituições ou mude a postura antes do 2º tempo.';}
  const ip=L.ms.find(m=>m.injPause);if(ip&&L.min<90){if(ip.mine&&!ONLINE()){L.paused=true;L.banner=`${ip.injPause} se lesionou. Faça a substituição.`;}ip.injPause=null;}
  if(L.min===90&&L.end===120&&L.ms.some(m=>m.mine&&m.inET)&&!L.done){L.paused=true;L.banner='Fim do tempo normal. Prorrogação de 30 minutos e, se continuar empatado, pênaltis.';}
  if(L.min>=(L.end||90))endLive();
  renderLive();scheduleTick();}
function skipLive(){const L=UI.live;clearTimeout(L.timer);while(L.min<(L.end||90)||L.min<90){stepMin(L);L.ms.forEach(m=>{m.injPause=null;});}L.ms.forEach(m=>m.flash=0);endLive();L.paused=false;renderLive();}
function endLive(){const L=UI.live;if(L.done)return;L.done=true;L.banner='Fim de jogo.';
  L.ms.forEach(m=>{if(m.ko&&m.g[0]===m.g[1]){m.pen=penalties(m);addEv(m,90,'pen',m.pen[0]>m.pen[1]?0:1,`Pênaltis ${m.pen[0]} x ${m.pen[1]}`);}});}

function finishMatchday(headless){
  const L=UI.live;const ev=L.ev;const res=S.mgr.map(()=>null);
  L.ms.forEach(m=>m.s.forEach(sd=>sd.served.forEach(id=>{const p=PL(id);if(p)p.sus=Math.max(0,p.sus-1);})));
  Object.values(S.P).forEach(p=>{if(p.inj>0)p.inj--;if(p.ps){p.sus+=p.ps;p.ps=0;}});
  for(const m of L.ms){const fx=m.fx;fx.hg=m.g[0];fx.ag=m.g[1];fx.ev=m.ev.filter(e=>e.type==='goal'||e.type==='rc'||e.type==='pen').map(e=>[e.m,e.side,e.type,e.txt]);
    m.s.forEach(sd=>sd.app.forEach(id=>{const p=PL(id);if(p){p.gm++;p.tj=(p.tj||0)+1;if(TS()){const c=p.cs||(p.cs={});(c[m.comp]||(c[m.comp]=[0,0]))[0]++;}}}));
    if(m.pen){fx.pen=m.pen;}
    if(m.ko){fx.w=(fx.hg>fx.ag||(fx.pen&&fx.pen[0]>fx.pen[1]))?fx.h:fx.a;}
    else if(m.comp===5)updTb(S.lib.tb[fx.h],S.lib.tb[fx.a],fx.hg,fx.ag);
    else if(m.comp===6)updTb(S.ucl.tb[fx.h],S.ucl.tb[fx.a],fx.hg,fx.ag);
    else if(m.comp===8)updTb(TM(fx.h).tb,TM(fx.a).tb,fx.hg,fx.ag);
    else if(ev.t==='L'){const H=TM(fx.h).tb,A=TM(fx.a).tb;H.j++;A.j++;H.gp+=fx.hg;H.gc+=fx.ag;A.gp+=fx.ag;A.gc+=fx.hg;
      if(fx.hg>fx.ag){H.v++;A.d++;H.pts+=3;H.f.push('V');A.f.push('D');}else if(fx.hg<fx.ag){A.v++;H.d++;A.pts+=3;A.f.push('V');H.f.push('D');}else{H.e++;A.e++;H.pts++;A.pts++;H.f.push('E');A.f.push('E');}
      [H,A].forEach(x=>{if(x.f.length>5)x.f.shift();});}
    S.mgr.forEach((mg,k)=>{const u=mg.tid;if(u!=null&&(fx.h===u||fx.a===u)){const home=fx.h===u;const gf=home?fx.hg:fx.ag,ga=home?fx.ag:fx.hg;res[k]={fx,home,gf,ga,opp:home?fx.a:fx.h,res:m.ko?(fx.w===u?'V':'D'):(gf>ga?'V':gf<ga?'D':'E'),ko:m.ko};}});
  }
  if(S.mode==='wc'){advanceWC(ev.s);S.mgr.forEach((mg,k)=>{const r=res[k];if(r){const o=TM(r.opp);news(`${evLabel(ev)}: ${TM(r.fx.h).name} ${r.fx.hg} x ${r.fx.ag} ${TM(r.fx.a).name}${r.fx.pen?` (pênaltis ${r.fx.pen[0]} x ${r.fx.pen[1]})`:''}.`,r.res==='D'?'bad':'',k);}});}
  else{
  S.mgr.forEach((mg,k)=>roundFinance(mg,ev,res[k]));
  if(isV5())S.mgr.forEach(mg=>{if(!mg.fired&&mg.tid!=null)mg.money=(mg.money||0)+Math.round(mgrSal(mg)*.25);});
  S.teams.forEach(t=>{if(!isHuman(t.id))t.cash+=Math.round(LGP(t.div).ai*t.rep/70);});
  S.mgr.forEach((mg,k)=>{if(res[k]&&!mg.fired)boardAfter(mg,k,ev,res[k]);});
  if(ev.t==='C')advanceCup(ev.s);
  if(ev.t==='X')advanceCont(ev.d);
  if(ev.t==='M')finishMundial();
  if(S.md%3===2)aiTransfers();
  S.mgr.forEach((mg,k)=>{genOffers(mg,k);genJobs(mg,k);mg.offers=mg.offers.filter(o=>o.exp>S.md);mg.jobs=mg.jobs.filter(j=>j.exp>S.md);});
  S.mgr.forEach(mg=>{if(mg.fired&&!mg.firedOffers)mg.firedOffers=firedOffers(mg);});
  }
  S.md++;S.turn++;
  if(S.mode!=='wc'&&S.md>=S.cal.length)seasonEnd();
  UI.live=null;
  if(headless)return;
  UI.screen='hub';UI.tab=ev.t==='C'?'copa':(ev.t==='X'||ev.t==='M')?'continental':ev.t==='W'?(ev.s<3?'grupos':'mata'):'rodada';UI.resDiv=null;
  if(ONLINE())onlineTurnDone();else{const n=autoRun();if(n)setTimeout(()=>toast(`${n} data(s) sem jogo do seu time simulada(s) automaticamente.`),300);save();}
  render();afterModals();
}
function attendance(t,opp){const fans=t.rep*t.rep*9;const pts=t.tb.f.reduce((s,x)=>s+(x==='V'?3:x==='E'?1:0),0);const form=.75+.5*(t.tb.f.length?pts/(t.tb.f.length*3):.5);
  const oppF=1+(TM(opp).rep-50)/150;const ref=LGP(t.div).tk;const pf=clamp(Math.pow(ref/Math.max(1,t.ticket),1.15),.12,1.6);
  return Math.round(Math.min(t.cap,fans*form*oppF*pf*(.9+R()*.2)));}
function roundFinance(mg,ev,ur){if(mg.tid==null)return;const t=TM(mg.tid);const L={bil:0,tv:0,pat:0,sal:0,man:0,jur:0,pub:0};
  if(ur&&ur.home){L.pub=attendance(t,ur.opp);L.bil=L.pub*t.ticket*(ev.t==='C'?1.2:(ev.t==='X'||ev.t==='M')?1.5:1);}
  if(ev.t==='L'){L.tv=LGP(t.div).tv;L.pat=t.rep*LGP(t.div).pat;}
  L.sal=-Math.round(t.pids.reduce((s,id)=>s+PL(id).sal,0)*.25);L.man=-Math.round(t.cap*4);
  L.jur=-Math.round(t.loan*.012);
  t.cash+=Math.round(L.bil+L.tv+L.pat+L.sal+L.man+L.jur);
  ['bil','tv','pat','sal','man','jur'].forEach(k=>mg.fin[k]+=L[k]);mg.finLast=L;
  if(ur)ur.pub=L.pub;
}
function expectedPos(t){const arr=S.teams.filter(x=>x.div===t.div).sort((a,b)=>b.rep-a.rep||a.id-b.id);return arr.indexOf(t)+1;}
function expectTxt(t){const e=expectedPos(t);if(LGS[t.div]){const L=LGS[t.div];const q=L.ucl||L.lib||4;return e<=2?'brigar pelo título':e<=q?`vaga na ${L.reg==='EU'?'Champions':'Libertadores'}`:e<=12?'campanha tranquila no meio da tabela':'terminar longe das últimas posições';}if(t.div===0)return e<=3?'brigar pelo título':e<=8?'vaga na Libertadores':e<=14?'campanha tranquila no meio da tabela':'escapar do rebaixamento';
  return e<=4?'o acesso':e<=10?'brigar pelo acesso':'campanha segura, sem rebaixamento';}
function tablePos(tid){const t=TM(tid);return sortedTable(t.div).findIndex(x=>x.id===tid)+1;}
function boardAfter(mg,k,ev,r){const t=TM(mg.tid);
  if(ev.t==='L'){mg.conf+=r.res==='V'?3:r.res==='E'?.5:-3.5;mg.rep+=r.res==='V'?.35:r.res==='E'?.05:-.25;
    if(ev.r>=5){const diff=expectedPos(t)-tablePos(t.id);mg.conf+=diff*.2;}}
  else if(r.ko){if(r.res==='V'){mg.conf+=3;mg.rep+=.6;}else{mg.conf-=ev.t==='C'?(t.div===0?5:1):4;}}
  else{mg.conf+=r.res==='V'?2:r.res==='E'?0:-2;mg.rep+=r.res==='V'?.4:0;}
  if(t.cash<-t.rep*2e5)mg.conf-=4;
  mg.conf=clamp(mg.conf,0,100);mg.rep=clamp(mg.rep,1,100);
  const opp=TM(r.opp);const sc=r.home?`${t.name} ${r.fx.hg} x ${r.fx.ag} ${opp.name}`:`${opp.name} ${r.fx.hg} x ${r.fx.ag} ${t.name}`;
  news(`${evLabel(ev,mg.tid)}: ${sc}${r.fx.pen?` (pênaltis ${r.fx.pen[0]} x ${r.fx.pen[1]})`:''}.${r.pub?` Público: ${num(r.pub)}.`:''}`,r.res==='D'?'bad':'',k);
  if(mg.conf<=8&&(ev.t==='C'||ev.r>=5)){mg.fired=true;mg.firedOffers=null;news(`${mg.name} foi demitido do ${t.name}.`,'bad');}
}
function advanceCup(s){const c=S.cup;const r=c.rounds[s];const winners=r.map(f=>f.w);const prize=[2e6,3e6,5e6,8e6,0][s];
  winners.forEach(id=>{if(s<4)TM(id).cash+=prize;});
  S.mgr.forEach(mg=>{if(mg.tid!=null&&winners.includes(mg.tid)&&s<4)mg.fin.pre+=prize;});
  if(s===4){const f=r[0];c.champ=f.w;c.vice=f.w===f.h?f.a:f.h;TM(c.champ).cash+=3e7;TM(c.vice).cash+=1.5e7;
    S.mgr.forEach(mg=>{if(c.champ===mg.tid){mg.fin.pre+=3e7;awardTitle(mg,`Copa do Brasil ${S.year}`,3e7);mg.rep=clamp(mg.rep+10,1,100);mg.conf=clamp(mg.conf+20,0,100);}if(c.vice===mg.tid)mg.fin.pre+=1.5e7;});
    news(`${TM(c.champ).name} é campeão da Copa do Brasil ${S.year}!`,isHuman(c.champ)?'job':'');return;}
  shuffle(winners);const nr=[];for(let i=0;i<winners.length;i+=2)nr.push({h:winners[i],a:winners[i+1],hg:null,ag:null});c.rounds.push(nr);
}

function movePlayer(pid,to,fee){const p=PL(pid);const from=TM(p.t),dest=TM(to);
  from.pids=from.pids.filter(x=>x!==pid);from.xi=from.xi.filter(x=>x!==pid);from.bench=from.bench.filter(x=>x!==pid);
  dest.pids.push(pid);p.t=to;p.sale=false;from.cash+=fee;dest.cash-=fee;
  const kf=mgrIdx(from.id),kt=mgrIdx(dest.id);
  if(kf>=0)S.mgr[kf].fin.ven+=fee;if(kt>=0){S.mgr[kt].fin.com-=fee;p.sal=Math.round(Math.max(p.sal,salFor(p))*1.1/1000)*1000;}
  S.mgr.forEach(mg=>mg.offers=mg.offers.filter(o=>o.pid!==pid));
  if(kf<0&&from.pids.length<18){const used=new Set(from.pids.map(i=>PL(i).n));youth(from,used);}
}
// quanto o clube vendedor quer e se o jogador aceita ir para o seu clube
function askInfo(p,u){const t=TM(p.t);const v=value(p);const rank=t.pids.map(PL).sort((a,b)=>b.f-a.f).indexOf(p);const top=rank<3;
  const need=v*(top?1.35:1.05)*(t.div<u.div&&t.div<=2?1.1:1)*(t.div===4?1.5:1);return {need,ask:Math.ceil(need/1e4)*1e4,top,refuse:t.rep-u.rep>22&&(p.id*7+S.year)%10<6};}
function evalBid(mg,p,amt){const t=TM(p.t),u=TM(mg.tid);const A=askInfo(p,u);
  if(u.pids.length>=32)return {ok:false,msg:'Seu elenco já tem 32 jogadores. Venda ou dispense alguém antes.'};
  if(u.cash<amt)return {ok:false,msg:`Caixa insuficiente. Você tem ${money(u.cash)}.`};
  if(A.refuse)return {ok:false,msg:`${p.n} não quer jogar no ${u.name} agora.`};
  const need=A.need;
  if(amt>=need)return {ok:true};
  if(amt>=need*.72)return {ok:false,counter:Math.ceil(need/1e4)*1e4,msg:`O ${t.name} recusou, mas aceita negociar.`};
  return {ok:false,msg:`O ${t.name} considerou a proposta muito baixa.`};}
function genOffers(mg,k){if(mg.tid==null||mg.fired)return;const u=TM(mg.tid);
  u.pids.map(PL).forEach(p=>{const v=value(p);const unsolicited=!p.sale&&p.f>=baseF(u)+8&&R()<.02;
    if((p.sale&&R()<.4)||unsolicited){if(mg.offers.some(o=>o.pid===p.id))return;
      const buyers=S.teams.filter(t=>!isHuman(t.id)&&t.cash>v*.8&&(S.v>=4?(t.div===u.div||t.rep>=u.rep-3):(t.div<=2?Math.abs(t.div-u.div)<=1:t.rep>=u.rep&&p.f>=baseF(u)))&&(unsolicited?t.rep>=u.rep-5:true));if(!buyers.length)return;
      const b=pick(buyers);const amt=Math.round(v*(unsolicited?1+R()*.4:.75+R()*.45)/1e4)*1e4;
      mg.offers.push({id:S.nid++,pid:p.id,from:b.id,amt,exp:S.md+3});news(`Proposta: o ${b.name} oferece ${money(amt)} por ${p.n}.`,'ofr',k);}});}
function aiTransfers(){const v4=S.v>=4;for(let k=0;k<(v4?6:3);k++){const buyers=S.teams.filter(t=>!isHuman(t.id)&&(v4?isLeague(t):isDom(t))&&t.pids.length<30).sort((a,b)=>b.rep-a.rep||a.id-b.id).slice(0,v4?70:32);const b=pick(buyers);if(!b)return;
  const pos=pick(['G','D','D','M','M','A','A']);const mine=b.pids.map(PL).filter(p=>p.p===pos).sort((x,y)=>y.f-x.f);const ref=mine[Math.min(1,mine.length-1)];const lvl=ref?ref.f:50;
  const cands=Object.values(S.P).filter(p=>p.p===pos&&p.t!==b.id&&!isHuman(p.t)&&(v4||isDom(TM(p.t)))&&TM(p.t).rep<b.rep&&TM(p.t).pids.length>19&&p.f>lvl&&value(p)<=b.cash*.6&&p.a<32);
  if(!cands.length)continue;const p=cands.sort((x,y)=>y.f-x.f||x.id-y.id)[ri(0,Math.min(3,cands.length-1))];const from=TM(p.t);const fee=Math.round(value(p)*(1+R()*.2)/1e4)*1e4;
  movePlayer(p.id,b.id,fee);news(`Mercado: ${p.n} deixa o ${from.name} e acerta com o ${b.name} por ${money(fee)}.`,'');}}
function genJobs(mg,k){const t=mg.tid!=null?TM(mg.tid):null;if(!t||S.md<8||mg.fired||mg.jobs.length)return;
  const p=.03+Math.max(0,mg.rep-45)/500;if(R()>p)return;
  const c=S.teams.filter(x=>!isHuman(x.id)&&(S.v>=4?isLeague(x):isDom(x))&&x.rep>t.rep+3&&x.rep<=mg.rep+22);if(!c.length)return;const j=pick(c);
  mg.jobs.push({tid:j.id,exp:S.md+3});news(`Convite: a diretoria do ${j.name} quer você como técnico. Responda na Caixa de entrada.`,'job',k);}
function takeJob(mg,k,tid){const old=mg.tid!=null?TM(mg.tid):null;if(old){old.pids.forEach(id=>PL(id).sale=false);old.post=1;}
  mg.tid=tid;mg.conf=60;mg.jobs=[];mg.offers=[];mg.fired=false;mg.firedOffers=null;mg.fin=emptyFin();mg.finLast=null;const t=TM(tid);if(!FORMS[t.form])t.form='4-4-2';autoLineup(t);
  news(`${mg.name} é o novo técnico do ${t.name}. Meta: ${expectTxt(t)}.`,'job');}
function firedOffers(mg){const cur=mg.tid!=null?TM(mg.tid):null;let c=S.teams.filter(x=>!isHuman(x.id)&&(S.v>=4?isLeague(x):isDom(x))&&x.rep<=Math.max(45,mg.rep+5)&&(!cur||x.rep<cur.rep));
  if((!S.online||S.v>=5))c=shuffle(c).slice(0,3);else{c=shuffle(c).sort((a,b)=>b.div-a.div).slice(0,8);c=shuffle(c).slice(0,3);}
  if(c.length<2)c=shuffle(S.teams.filter(x=>x.div===2&&!isHuman(x.id))).slice(0,3);return c.map(x=>x.id);}

/* ====================== AÇÕES DOS TÉCNICOS ======================
   Toda decisão que muda o mundo passa por applyAct. No modo online cada
   jogador guarda suas ações da rodada; quando os dois confirmam, os dois
   navegadores aplicam as ações na mesma ordem e simulam a mesma rodada. */
function fail(k,msg){if(MODE==='sync')news(msg,'bad',k);return {ok:false,msg};}
function applyAct(k,a){const mg=S.mgr[k];const t=mg.tid!=null?TM(mg.tid):null;const p=a.pid!=null?PL(a.pid):null;
  switch(a.k){
  case 'lineup':{if(!t||mg.fired)return;if(FORMS[a.form])t.form=a.form;t.post=clamp(a.post|0,0,2);t.xi=(a.xi||[]).filter(id=>t.pids.includes(id)).slice(0,11);t.bench=(a.bench||[]).filter(id=>t.pids.includes(id)&&!t.xi.includes(id)).slice(0,7);return;}
  case 'bid':{if(!t||mg.fired)return fail(k,'Você está sem clube.');if(!p||p.t!==a.from||isHuman(p.t))return fail(k,`Negócio não concluído: ${p?p.n:'o jogador'} já não está no clube.`);
    const r=evalBid(mg,p,a.amt);if(!r.ok){if(MODE==='sync')news(`Negócio por ${p.n} não concluído: ${r.msg}`,'bad',k);return r;}
    const from=TM(p.t).name;movePlayer(p.id,t.id,a.amt);news(`Contratação: ${p.n} chega do ${from} por ${money(a.amt)}.`,'job',k);return {ok:true};}
  case 'sale':{if(p&&t&&p.t===t.id){p.sale=!!a.on;if(!p.sale)mg.offers=mg.offers.filter(o=>o.pid!==p.id);}return;}
  case 'oacc':{const o=mg.offers.find(x=>x.id===a.oid);if(!o||!t)return fail(k,'A proposta expirou.');const q=PL(o.pid);
    if(!q||q.t!==t.id)return fail(k,'A proposta expirou.');if(t.pids.length<=16)return fail(k,'O elenco precisa ter pelo menos 16 jogadores.');
    if(TM(o.from).cash<o.amt*.5){mg.offers=mg.offers.filter(x=>x!==o);return fail(k,`O ${TM(o.from).name} desistiu da compra de ${q.n}.`);}
    movePlayer(q.id,o.from,o.amt);news(`Venda: ${q.n} vai para o ${TM(o.from).name} por ${money(o.amt)}.`,'',k);return {ok:true};}
  case 'orej':{mg.offers=mg.offers.filter(x=>x.id!==a.oid);return;}
  case 'rel':{if(!p||!t||p.t!==t.id)return;if(t.pids.length<=16)return fail(k,'O elenco precisa ter pelo menos 16 jogadores.');
    t.cash-=p.sal*3;mg.fin.sal-=p.sal*3;t.pids=t.pids.filter(x=>x!==p.id);t.xi=t.xi.filter(x=>x!==p.id);t.bench=t.bench.filter(x=>x!==p.id);mg.offers=mg.offers.filter(o=>o.pid!==p.id);news(`${p.n} foi dispensado pelo ${t.name}.`,'');delete S.P[p.id];return {ok:true};}
  case 'rename':{if(p){const n=String(a.n||'').trim().slice(0,30);if(n)p.n=n;}return;}
  case 'tk':{if(t)t.ticket=clamp(a.v|0,5,300);return;}
  case 'loan':{if(t&&t.loan+5e6<=t.rep*3e5){t.loan+=5e6;t.cash+=5e6;news(`O ${t.name} pegou R$ 5 mi emprestados.`,'',k);}return;}
  case 'repay':{if(t){const v=Math.min(5e6,t.loan);if(v>0&&t.cash>=v){t.loan-=v;t.cash-=v;}}return;}
  case 'expand':{if(t&&t.cash>=5e6&&t.cap<90000){t.cash-=5e6;mg.fin.obr-=5e6;t.cap+=2000;news(`${t.std} ampliado para ${num(t.cap)} lugares.`,'',k);}return;}
  case 'job':{if(mg.jobs.some(j=>j.tid===a.tid)&&!isHuman(a.tid)){takeJob(mg,k,a.tid);return {ok:true};}return fail(k,'O convite não está mais disponível.');}
  case 'jrej':{mg.jobs=mg.jobs.filter(j=>j.tid!==a.tid);return;}
  case 'fpick':{if(!mg.fired)return;if((mg.firedOffers||[]).includes(a.tid)&&!isHuman(a.tid)){mg.rep=clamp(mg.rep-10,1,100);takeJob(mg,k,a.tid);return {ok:true};}
    mg.firedOffers=firedOffers(mg);return fail(k,'Esse clube já contratou outro técnico. Veja as novas propostas.');}
  case 'autosub':{mg.autoSub=!!a.v;return;}
  }}
function canEdit(){if(ONLINE()&&UI.on.sent){toast('Você já confirmou a rodada. Aguarde o adversário.');return false;}return true;}
function doAct(a){if(!canEdit())return {ok:false,msg:''};MODE='preview';const r=applyAct(UI.me,a)||{ok:true};
  if(r.ok!==false){if(ONLINE()){UI.on.pending.push(a);saveOnline();}else save();}return r;}

function sortedTable(d){return S.teams.filter(t=>t.div===d).sort((a,b)=>b.tb.pts-a.tb.pts||b.tb.v-a.tb.v||(b.tb.gp-b.tb.gc)-(a.tb.gp-a.tb.gc)||b.tb.gp-a.tb.gp||cmpName(a,b));}
function topScorer(d){return Object.values(S.P).filter(p=>TM(p.t).div===d&&p.gl>0).sort((a,b)=>b.gl-a.gl||a.id-b.id)[0];}
function seasonEnd(){
  const tabs=[0,1,2].map(sortedTable);const champ=tabs.map(t=>t[0].id);
  const scorers=[0,1,2].map(topScorer).map(p=>p?`${p.n} (${TM(p.t).short}) ${p.gl}`:'-');
  const prizes=[[3e7,2e6],[5e6,4e5],[1.5e6,1e5]];
  tabs.forEach((tab,d)=>tab.forEach((t,i)=>{const pr=(20-i)*prizes[d][1]+(i===0?prizes[d][0]:0);t.cash+=pr;const k=mgrIdx(t.id);if(k>=0)S.mgr[k].fin.pre+=pr;}));
  const up1=tabs[1].slice(0,4),up2=tabs[2].slice(0,4),dn0=tabs[0].slice(16),dn1=tabs[1].slice(16);
  if(S.v>=3){const q=[];if(S.cup.champ!=null&&TM(S.cup.champ).div<=2&&!dn0.some(t=>t.id===S.cup.champ))q.push(S.cup.champ);for(const t of tabs[0]){if(q.length>=6)break;if(!q.includes(t.id)&&!dn0.includes(t))q.push(t.id);}S.libNext=q;}
  const ftabs={};if(S.v>=4)LCODES.forEach(c=>{const ids=S.teams.filter(t=>t.div===c);if(!ids.length)return;const played=ids.some(t=>t.tb.j>0);
    const tab=played?sortedTable(c):ids.slice().sort((a,b)=>b.rep-a.rep||a.id-b.id);ftabs[c]=tab;const P=LGS[c];
    tab.forEach((t,i)=>{const pr=(tab.length-i)*P.pr[1]+(i===0?P.pr[0]:0);t.cash+=pr;const k=mgrIdx(t.id);if(k>=0)S.mgr[k].fin.pre+=pr;if(!isHuman(t.id))t.rep=clamp(t.rep+(8-i)*.2,30,99);});});
  if(S.v>=4){const eu=S.teams.filter(t=>t.div===4).map(t=>t.id);LCODES.forEach(c=>{if(LGS[c].ucl&&ftabs[c])ftabs[c].slice(0,LGS[c].ucl).forEach(t=>eu.push(t.id));});S.uclNext=eu;
    const sa=S.teams.filter(t=>t.div===3).map(t=>t.id);if(ftabs[16])ftabs[16].slice(0,6).forEach(t=>sa.push(t.id));S.libForNext=sa;
    S.lgChamp={};LCODES.forEach(c=>{if(ftabs[c]&&ftabs[c][0].tb.j>0)S.lgChamp[c]=ftabs[c][0].id;});}
  const per=S.mgr.map(mg=>{if(mg.tid==null||mg.fired)return {pos:null,div:null,verdict:'Você terminou a temporada sem clube.'};const ut=TM(mg.tid);
    const pos=(ut.div<=2?tabs[ut.div]:(ftabs[ut.div]||sortedTable(ut.div))).findIndex(t=>t.id===ut.id)+1;const exp=expectedPos(ut);
    let dc=(exp-pos)*1.5;if(pos===1){dc+=30;awardTitle(mg,`${divName(ut.div)} ${S.year}`,ut.div<=2?[3e7,5e6,1.5e6][ut.div]+20*[2e6,4e5,1e5][ut.div]:LGS[ut.div].pr[0]+(ftabs[ut.div]||[]).length*LGS[ut.div].pr[1]);mg.rep+=ut.div<=2?[15,8,5][ut.div]:12;}
    if(up1.includes(ut)||up2.includes(ut)){dc+=25;mg.rep+=6;}
    if(dn0.includes(ut)||dn1.includes(ut)){dc-=40;mg.rep-=8;}
    mg.conf=clamp(mg.conf+dc,0,100);mg.rep=clamp(mg.rep,1,100);
    const verdict=mg.conf<=12?'A diretoria decidiu não renovar com você.':mg.conf<40?'A diretoria está insatisfeita, mas mantém você no cargo.':'A diretoria aprovou o seu trabalho.';
    if(mg.conf<=12){mg.fired=true;mg.firedOffers=null;}
    return {pos,div:ut.div,tid:ut.id,verdict,pre:mg.fin.pre,bonus:(mg.tp||[]).filter(x=>x.y===S.year).reduce((a,x)=>a+x.b,0),money:mg.money||0};});
  S.history.unshift({y:S.year,A:champ[0],B:champ[1],C:champ[2],cup:S.cup.champ,lib:S.lib?S.lib.champ:null,ucl:S.ucl?S.ucl.champ:null,mun:S.mun?S.mun.champ:null,lg:S.lgChamp||null,us:per.map(x=>x.pos?{tid:x.tid,div:x.div,pos:x.pos}:null),art:scorers[0]});
  dn0.forEach(t=>{t.div=1;t.rep=clamp(t.rep-4,30,99);});dn1.forEach(t=>{t.div=2;t.rep=clamp(t.rep-4,30,99);});
  up1.forEach(t=>{t.div=0;t.rep=clamp(t.rep+5,30,99);});up2.forEach(t=>{t.div=1;t.rep=clamp(t.rep+4,30,99);});
  tabs.forEach(tab=>tab.forEach((t,i)=>{if(!dn0.includes(t)&&!dn1.includes(t)&&!up1.includes(t)&&!up2.includes(t))t.rep=clamp(t.rep+(10-i)*.25,30,99);}));
  const retired=[];
  Object.values(S.P).forEach(p=>{p.a++;const d=p.a<=22?ri(0,6):p.a<=26?ri(-1,4):p.a<=30?ri(-2,2):p.a<=33?ri(-4,1):ri(-6,-1);p.f=clamp(p.f+d,25,96);
    if((p.a>=35&&R()<(p.a-34)*.25)||p.a>=40){retired.push(p);}});
  retired.forEach(p=>{const t=TM(p.t);t.pids=t.pids.filter(x=>x!==p.id);t.xi=t.xi.filter(x=>x!==p.id);t.bench=t.bench.filter(x=>x!==p.id);if(p.f>=74||isHuman(t.id))news(`${p.n} (${t.name}) anuncia aposentadoria aos ${p.a} anos.`,'');delete S.P[p.id];});
  S.teams.forEach(t=>{const used=new Set(t.pids.map(i=>PL(i).n));const hu=isHuman(t.id);const n=hu?2:ri(1,3);for(let i=0;i<n;i++)youth(t,used);
    const cnt={G:0,D:0,M:0,A:0};t.pids.forEach(id=>cnt[PL(id).p]++);const need={G:3,D:7,M:7,A:4};
    if(!hu){for(const pos in need)while(cnt[pos]<need[pos]){t.pids.push(mkP(genNameP(used,t.pool),pos,baseF(t)-ri(2,10),ri(20,30),t.id).id);cnt[pos]++;}
      while(t.pids.length>30){const w=t.pids.map(PL).sort((a,b)=>a.f-b.f||a.id-b.id)[0];t.pids=t.pids.filter(x=>x!==w.id);delete S.P[w.id];}}
    else if(cnt.G<2){t.pids.push(mkP(genNameP(used,t.pool),'G',baseF(t)-8,ri(20,28),t.id).id);}
    t.pids.forEach(id=>{const p=PL(id);p.sal=Math.max(p.sal,Math.round(salFor(p)*.8/1000)*1000);});});
  S.mgr.forEach(mg=>{mg.offers=[];mg.jobs=[];});
  S.lastSummary={y:S.year,champ,cup:S.cup.champ,lg:S.lgChamp||null,lib:S.lib?S.lib.champ:null,ucl:S.ucl?S.ucl.champ:null,mun:S.mun?S.mun.champ:null,up1:up1.map(t=>t.id),up2:up2.map(t=>t.id),dn0:dn0.map(t=>t.id),dn1:dn1.map(t=>t.id),scorers,per,retired:retired.length};
  S.year++;S.mgr.forEach(mg=>mg.seasons++);newSeason();
  S.mgr.forEach((mg,k)=>{if(mg.fired){mg.firedOffers=firedOffers(mg);return;}if(mg.tid!=null)autoLineup(TM(mg.tid));
    if(mg.rep>55&&R()<.5){const c=S.teams.filter(x=>!isHuman(x.id)&&(S.v>=4?isLeague(x):isDom(x))&&x.rep>TM(mg.tid).rep+3&&x.rep<=mg.rep+22);if(c.length){const j=pick(c);mg.jobs.push({tid:j.id,exp:S.md+3});news(`Convite: o ${j.name} quer contratar você para ${S.year}.`,'job',k);}}});
}

  EXT.forEach((d,i)=>{const lg=LGOF[d[0]];const div=lg||(d[2]==='SA'?3:4);const P=LGS[lg];
    const t={id:S.teams.length,name:d[0],short:d[1],div,ext:d[2],c:[d[3],d[4],d[5]],rep:d[6],std:d[7],cap:lg?Math.max(30000,Math.round(d[6]*d[6]*7)):40000,pool:d[8],pids:[],xi:[],bench:[],form:pick(['4-4-2','4-3-3','4-3-3','4-5-1']),post:1,loan:0,ticket:P?P.tk:0};
    t.cash=Math.round(t.rep*t.rep*(P?P.cash:8000)/1e5)*1e5;S.teams.push(t);buildSquad(t,d[9]);});
  NEWC.forEach(d=>{const P=LGS[d[2]];const t={id:S.teams.length,name:d[0],short:d[1],div:d[2],c:[d[3],d[4],d[5]],rep:d[6],std:d[7],cap:d[8],pool:P.pool,pids:[],xi:[],bench:[],form:pick(['4-4-2','4-3-3','4-3-3','4-5-1','3-5-2']),post:1,loan:0,ticket:P.tk};
    t.cash=Math.round(t.rep*t.rep*P.cash/1e5)*1e5;S.teams.push(t);buildSquad(t,d[9]);});}

}

function autoRun(){let n=0;const y=S.year;const stop=(!S.online||S.v>=5);const inbox=()=>S.mgr.reduce((a,m)=>a+m.jobs.length+m.offers.length,0);
  while(S.mode!=='wc'&&curEv()&&!humanPlays(curEv())&&!S.mgr.some(m=>m.fired)&&S.year===y&&n<80){const b=inbox();startMatchday(true);finishMatchday(true);n++;if(stop&&inbox()>b)break;}return n;}

   ${p.cs&&Object.keys(p.cs).length?`<div class="small" style="margin-top:6px"><b>Nesta temporada, por competição:</b> ${Object.entries(p.cs).map(([c,v])=>`${esc(compName(+c))}: ${v[0]} jogos, ${v[1]} gols`).join(' · ')}</div>`:''}
   ${S.v>=4&&S.mode!=='wc'?(()=>{const r=riskF(p);const pc=x=>{const d=Math.round((x-1)*100);return d===0?'0%':(d>0?'+':'')+d+'%';};return `<div class="small muted" style="margin-top:4px">Efeito no preço: lesões ${pc(r.fi)} · cartões ${pc(r.fc)} · desempenho ${pc(r.fp)}. Valor considera todos os torneios.</div>`;})():''}

     <p class="small muted" style="margin-bottom:0">Oferta abaixo do pedido pode render contraproposta. Novo salário ≈ ${money(Math.round(Math.max(p.sal,salFor(p))*1.1/1000)*1000)}/mês.</p>

  showModal('Ficha do jogador',body,foot);}

/* ====================== CONTROLES ====================== */
const nameIn=()=>{const v=(($('#mgr')||{}).value||'').trim();if(v)UI.mgr=v;return v;};
const ACT={
  sdiv:v=>{nameIn();UI.startDiv=+v;UI.pickTid=null;render();},
  pick:v=>{nameIn();UI.pickTid=+v;render();},
  begin:()=>{const n=nameIn()||'Professor';stopOnline();UI.me=0;newGame(n,UI.pickTid);UI.screen='hub';UI.tab='elenco';save();render();},
  load:()=>{const s=loadSaved();if(s){stopOnline();S=upgradeSolo(s);UI.me=0;UI.screen='hub';UI.tab='elenco';render();afterModals();}},
  import:()=>{const o=importCode(($('#imp')||{}).value||'');if(!o){toast('Código inválido.');return;}stopOnline();S=o;UI.me=0;save();UI.screen='hub';render();},
  ocreate:()=>{const n=nameIn();if(!n){toast('Digite seu nome primeiro.');$('#mgr').focus();return;}createOnline(n);},
  ojoin:v=>{const n=nameIn();if(!n){toast('Digite seu nome primeiro.');$('#mgr').focus();return;}joinOnline(v,n);},
  oopen:v=>openOnline(v),
  owait:v=>waitFor(v),
  odel:async v=>{try{await DB.doc('games/'+v).delete();}catch(e){toast(dbErr(e));return;}if(UI.waitUnsub){UI.waitUnsub();UI.waitUnsub=null;}UI.screen='start';render();toast('Partida cancelada.');},
  wback:()=>{if(UI.waitUnsub){UI.waitUnsub();UI.waitUnsub=null;}UI.screen='start';render();},
  oleave:()=>{stopOnline();S=null;UI.me=0;UI.screen='start';render();},
  ready:()=>sendReady(),
  fshow:()=>showFired(),
  tab:v=>{UI.tab=v;UI.confirm=null;render();},
  div:v=>{UI.div=+v;render();},rdiv:v=>{UI.resDiv=+v;render();},adiv:v=>{UI.artDiv=+v;render();},
  play:()=>{if(!UT()||ME().fired){toast('Você precisa de um clube.');return;}const ev=curEv();if(!ev){afterModals();return;}if(!ONLINE()&&!fixtureOf(myTid(),ev)){quickSim();return;}startMatchday(false);},
  ctab:v=>{UI.ctab=v;render();},
  rk:v=>{UI.rk=v;render();},
  wcpick:v=>{nameIn();UI.wcPick=+v;render();},
  wcbegin:()=>{const n=nameIn()||'Professor';stopOnline();UI.me=0;newWC(n,UI.wcPick);UI.screen='hub';UI.tab='elenco';save();render();},
  wcload:()=>{const s=loadWC();if(s){stopOnline();S=s;UI.me=0;UI.screen='hub';UI.tab='elenco';render();afterModals();}},
  wcend:()=>{lsDel(WC_KEY);closeModal();S=null;UI.screen='start';UI.wcPick=null;render();},
  wcquit:()=>{save();S=null;UI.screen='start';render();},
  cyc:v=>{if(!canEdit())return;const t=UT();const id=+v;const p=PL(id);if(t.xi.includes(id)){t.xi=t.xi.filter(x=>x!==id);if(t.bench.length<7)t.bench.push(id);}
    else if(t.bench.includes(id)){t.bench=t.bench.filter(x=>x!==id);}
    else{if(!avail(p)){toast(`${p.n} está indisponível.`);return;}if(t.xi.length<11)t.xi.push(id);else if(t.bench.length<7){t.bench.push(id);toast('Já há 11 titulares. Jogador foi para o banco.');}else{toast('Titulares e banco estão completos.');return;}}
    persistSoon();render();},
  elpos:v=>{UI.el.pos=v||'';render();},
  mclear:()=>{UI.mkt={pos:'',div:'',max:'',q:'',amin:'',amax:'',fmin:'',sort:'f',can:UI.mkt.can};render();},
  mcan:()=>{UI.mkt.can=!UI.mkt.can;render();},
  auto:()=>{if(!canEdit())return;autoLineup(UT());persistSoon();render();toast('Time escalado pelo auxiliar técnico.');},
  pinfo:(v,el,e)=>{e.preventDefault();UI.counter=null;UI.confirm=null;pModal(+v);},
  rename:v=>{const n=(($('#rn')||{}).value||'').trim();if(!n)return;doAct({k:'rename',pid:+v,n});render();pModal(+v);toast('Nome atualizado.');},
  sale:v=>{const p=PL(+v);doAct({k:'sale',pid:+v,on:!p.sale});render();pModal(+v);},
  rel:v=>{if(UT().pids.length<=16){toast('O elenco precisa ter pelo menos 16 jogadores.');return;}UI.confirm='rel'+v;pModal(+v);},
  rel2:v=>{const r=doAct({k:'rel',pid:+v});closeModal();render();if(r.msg)toast(r.msg);},
  bid:v=>{const amt=Math.round((parseFloat(($('#bid')||{}).value)||0)*1e6);const p=PL(+v);const r=doAct({k:'bid',pid:+v,amt,from:p.t});
    if(r.ok){closeModal();render();toast(ONLINE()?`${p.n} contratado! O negócio se confirma quando a rodada começar.`:`${p.n} contratado!`);return;}
    if(r.counter){UI.counter={pid:+v,amt:r.counter};pModal(+v);}const m=$('#bidmsg');if(m)m.textContent=r.msg||'';},
  bidc:v=>{const c=UI.counter;if(!c)return;const p=PL(c.pid);const r=doAct({k:'bid',pid:c.pid,amt:c.amt,from:p.t});
    if(r.ok){closeModal();render();toast(`${p.n} contratado!`);}else{const m=$('#bidmsg');if(m)m.textContent=r.msg||'';}},
  oacc:v=>{const r=doAct({k:'oacc',oid:+v});render();if(r.msg)toast(r.msg);},
  orej:v=>{doAct({k:'orej',oid:+v});render();},
  jacc:v=>{const r=doAct({k:'job',tid:+v});UI.tab='elenco';render();if(r.msg)toast(r.msg);},
  jrej:v=>{doAct({k:'jrej',tid:+v});render();},
  fpick:v=>{const r=doAct({k:'fpick',tid:+v});if(r.ok===false){if(r.msg)toast(r.msg);showFired();return;}closeModal();UI.tab='elenco';render();},
  sumok:()=>{UI.seenSum=sumTag(S.lastSummary);lsSet(sumKey(),sumTag(S.lastSummary));closeModal();render();if(ME().fired)showFired();},
  tk:v=>{doAct({k:'tk',v:UT().ticket+(+v)});render();},
  loan:()=>{doAct({k:'loan'});render();},
  repay:()=>{doAct({k:'repay'});render();},
  expand:()=>{doAct({k:'expand'});render();},
  spd:v=>{CFG.speed=+v;saveCfg();render();},
  save:()=>{save();toast(UI.saved?'Jogo salvo.':'Este navegador bloqueou o salvamento. Use o código de backup.');},
  exp:()=>{const b=$('#expbox');b.value=exportCode();b.hidden=false;$('#copyb').hidden=false;b.select();},
  copy:()=>{const b=$('#expbox');navigator.clipboard.writeText(b.value).then(()=>toast('Código copiado.'),()=>{b.select();toast('Selecione e copie o texto manualmente.');});},
  reset:()=>{UI.confirm='reset';render();},reset0:()=>{UI.confirm=null;render();},
  reset2:()=>{lsDel(SAVE_KEY);lsDel('fb_seen_solo');S=null;UI.confirm=null;UI.screen='start';UI.pickTid=null;render();},
  close:()=>closeModal(),
  ovclose:(v,el,e)=>{if(e.target===el)closeModal();},
  // ao vivo
  lstart:()=>{UI.live.banner='';tick();},
  lpause:()=>{const L=UI.live;L.paused=!L.paused;if(!L.paused){L.banner='';scheduleTick();}renderLive();},
  lsubs:()=>{const L=UI.live;if(!L.done&&L.min>0){L.paused=true;clearTimeout(L.timer);renderLive();}subsModal();},
  lspd:v=>{CFG.speed=+v;saveCfg();renderLive();if(!UI.live.paused&&UI.live.min>0)scheduleTick();},
  lskip:()=>{if(UI.live.min===0)UI.live.banner='';skipLive();},
  lcont:()=>finishMatchday(false),
  ltab:v=>{UI.live.tab=+v;render();},
  lmatch:v=>matchModal(+v),
  dosub:()=>{const L=UI.live;const m=L.ms.find(x=>x.mine);const i=m.s[0].user?0:1;const o=+($('#sout')||{}).value,n=+($('#sin')||{}).value;
    if(!o||!n){toast('Escolha quem sai e quem entra.');return;}if(m.s[i].subs>=5){toast('Limite de 5 trocas.');return;}doSub(m,i,o,n,L.min);renderLive();subsModal();},
  closesub:()=>{const L=UI.live;const m=L.ms.find(x=>x.mine);const i=m.s[0].user?0:1;const ps=$('#spost');if(ps){m.s[i].post=+ps.value;UT().post=m.s[i].post;}closeModal();if(L.min>0&&!L.done){L.paused=false;L.banner='';scheduleTick();}renderLive();},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(ACT[a]){if(el.tagName==='A')e.preventDefault();ACT[a](el.dataset.v,el,e);}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('mrow'))ACT.lmatch(e.target.dataset.v);if(e.key==='Escape'&&$('#modal').innerHTML&&$('#modal .ov[data-a]'))closeModal();});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;const v=e.target.value;
  if(c==='form'){if(!canEdit()){render();return;}const t=UT();t.form=v;autoLineup(t);persistSoon();render();toast(`Esquema ${v}: time reescalado.`);}
  else if(c==='post'){if(!canEdit()){render();return;}UT().post=+v;persistSoon();render();}
  else if(c==='half'){CFG.halfStop=e.target.checked;saveCfg();}
  else if(c==='asub'){doAct({k:'autosub',v:e.target.checked});}
  else if(c==='pool'){UI.pool=v;}
  else if(c==='timer'){UI.timer=+v;}
  else if(c==='gtimer'&&UI.on){DB.doc('games/'+UI.on.gid).update({timer:+v}).then(()=>toast('Tempo atualizado para os dois.'),e=>toast(dbErr(e)));}
  else if(c==='elsort'){UI.el.sort=v;render();}
  else if(c==='msort'){UI.mkt.sort=v;render();}
  else if(c==='mamin'){UI.mkt.amin=v;render();}else if(c==='mamax'){UI.mkt.amax=v;render();}else if(c==='mfmin'){UI.mkt.fmin=v;render();}
  else if(c==='mp'){UI.mkt.pos=v;render();}else if(c==='md'){UI.mkt.div=v;render();}else if(c==='mm'){UI.mkt.max=v;render();}});
let mqT;document.addEventListener('input',e=>{if(e.target.dataset.c==='mq'){UI.mkt.q=e.target.value;clearTimeout(mqT);mqT=setTimeout(()=>{render();const i=$('#mq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},350);}
  else if(e.target.id==='mgr'){UI.mgr=e.target.value;}});

/* ====================== INÍCIO ====================== */
function start(data){
  if(data&&data.gid){UI.resumeGid=data.gid;}
  else{try{if(data&&data.s){S=JSON.parse(data.s);UI.me=0;UI.screen=data.screen==='start'?'start':'hub';UI.tab=data.tab||'elenco';}}catch(e){S=null;}}
  render();if(S&&UI.screen==='hub')afterModals();
  initCaps();
}
window.claude?.hot?.snapshot?.(()=>ONLINE()?{gid:UI.on.gid}:{s:UI.screen==='live'?UI.backup:(S?JSON.stringify(S):null),screen:UI.screen==='live'||UI.screen==='wait'?'hub':UI.screen,tab:UI.tab});
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
